# NAMES-ONLY SECRET CONTRACT for the GFTB platform serving stack (TIN-3815 /
# TIN-3817 staging serving slice).
#
# This file carries NO VALUES and never will. It mirrors
# ../web/secrets.contract.yaml and EXTENDS — never restates — the member
# database contract in ../member-db/secrets.contract.yaml (PR #118), which
# remains the authority for gftb-member-db-app, gftb-member-db-runtime,
# gftb-member-db-migrator-dsn, and gftb-member-db-backup-s3. Only the names
# THIS stack consumes or introduces appear here.
#
# THE LOAD-BEARING INVARIANT is the member-db contract's own: two credentials
# reach the same database with deliberately different authority, and no single
# workload is ever handed both. The web and worker Deployments consume ONLY the
# DML-only runtime DSN below; the owner/DDL DSN (gftb-member-db-migrator-dsn)
# goes ONLY to the pre-rollout migration Job. scripts/validate-platform-stack.sh
# fails this stack if the migrator secret name appears anywhere in it.
apiVersion: v1
kind: SecretContract
metadata:
  name: gftb-platform-secrets-contract
  namespace: members-greatfallstoolbus-org-production
spec:
  secrets:
    - name: gftb-member-db-runtime-dsn
      namespace: members-greatfallstoolbus-org-production
      origin: operator-minted
      type: Opaque
      keys: [dsn]
      role: gftb_app
      authority: >-
        The DML-only runtime credential expressed as a libpq DSN with
        sslmode=verify-full, placed in the PLATFORM namespace because that is
        where web and worker run. It is a derivative of the member-db
        contract's gftb-member-db-runtime (kubernetes.io/basic-auth in the
        database namespace, bound to the gftb_app role by managed.roles) —
        not a second credential; rotating the runtime password means
        re-deriving this Secret. The role carries no DDL, no ownership,
        bypassrls false, connectionLimit 40 (the replica budget in
        deployment-web.yaml is sized against that 40).
      consumed_by:
        - deployment-web.yaml (DATABASE_URL)
        - deployment-worker.yaml (DATABASE_URL)
      never_consumed_by:
        - the pre-rollout migration Job (it takes gftb-member-db-migrator-dsn,
          and only it ever does — ../member-db/secrets.contract.yaml)
      minted_by: docs/runbooks/staging-platform-serving.md step C1

    - name: gftb-platform-stripe-testmode
      namespace: members-greatfallstoolbus-org-production
      origin: operator-minted
      type: Opaque
      keys: [STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PUBLISHABLE_KEY]
      authority: >-
        Stripe TEST-MODE keys only (sk_test_/whsec_/pk_test_ — the app half
        refuses any other prefix, slices doc §3: technically incapable of a
        live call). Referenced with optional true by web and worker so the
        stack schedules before the rails slice (TIN-3818) lands; the Secret is
        minted, and the api.stripe.com egress allow is added, only at the
        operator sitting that enables that slice. Live-mode keys are gated by
        the ADR 0014 production-activation rows and are OUT OF SCOPE for this
        contract entirely.
      consumed_by:
        - deployment-web.yaml (STRIPE_* env, optional)
        - deployment-worker.yaml (STRIPE_* env, optional)
      minted_by: NOT YET — deferred to the TIN-3818 rails sitting

  # Consumed by reference from the member-db contract (PR #118); listed for
  # inventory completeness, defined and governed THERE:
  #   gftb-member-db-migrator-dsn   (platform namespace; migration Job only)
  #   gftb-member-db-runtime        (database namespace; parent of the runtime
  #                                  DSN above)
  #
  # The GHCR pull path needs no imagePullSecret while the platform image lives
  # on the PUBLIC ghcr.io/great-falls-tool-bus/greatfallstoolbus.org package.
  # The TIN-3815 rename/privatization gates (ADR 0014 §1.3: private CI,
  # package pull, rollback proved under the new identity) change that: a
  # private gftb-platform package requires an operator-provisioned pull Secret
  # in this namespace, recorded here BY NAME at that sitting, never committed.

# --- env_contract (TIN-4020 s2) ---------------------------------------------
#
# The `secrets:` block above documents SECRET OBJECTS (a name, its keys, and
# which Deployment mounts them). This block documents the individual env-var
# NAMES those objects (and one plain config value) resolve to at the
# container boundary, in the idiom ../web/secrets.contract.yaml uses for its
# per-name entries (purpose / plane / rotation / owner) — names only, never
# values, per this repo's posture (see ../web/secrets.contract.yaml header).
# Nothing here creates a new Secret or changes what `secrets:` already
# declares; it is a cross-reference at the granularity an operator actually
# rotates or hands to a Deployment spec.
env_contract:
  - name: STRIPE_SECRET_KEY
    purpose: >-
      Server-side Stripe API key. Test-mode shape enforced APP-SIDE, not by
      this contract: greatfallstoolbus.org's src/lib/server/stripe/config.ts
      anchors a whole-string ^sk_test_[A-Za-z0-9]+$ regex and throws
      StripeConfigError on anything else (a live key, a restricted rk_ key, or
      a smuggled second value behind a valid prefix) before a client can be
      constructed — this Secret cannot itself carry a live key that the app
      would use, only one the app would refuse to boot with.
    plane: gftb-platform-stripe-testmode (this file's `secrets:` block)
    custody: >-
      Operator (Jess) — test keys are minted and rotated from Jess's Stripe
      account (jess@sulliwood.org), never generated or handled by an agent.
      Agents never read, decrypt, or transcribe the value; TIN-3818 spec §11
      / gate.ts record the separate live-mode gate this key can never open.
    rotation: >-
      Freely rotatable (test-mode key; no DNS pin, no external subscriber to
      notify). Rotate on suspected exposure or operator turnover: mint a new
      sk_test_ key in the Stripe dashboard, update the Secret, roll the
      Deployments. No coordination needed with STRIPE_WEBHOOK_SECRET — they
      rotate independently.
    consumed_by:
      - deployment-web.yaml (STRIPE_SECRET_KEY env, optional secretKeyRef)
      - deployment-worker.yaml (STRIPE_SECRET_KEY env, optional secretKeyRef)
    minted_by: NOT YET — deferred to the TIN-3818 rails sitting (see `secrets:` above)

  - name: STRIPE_WEBHOOK_SECRET
    purpose: >-
      The endpoint signing secret Stripe issues per webhook endpoint,
      consumed by src/lib/server/stripe/webhook.ts's
      verifyWebhookSignature() call — the ONLY thing standing between the
      public POST /api/stripe/webhook route and an attacker-forged event once
      that path is edge-reachable (see the webhook-public-reachability design
      note this same change adds, docs/research/). Shape-enforced app-side:
      config.ts anchors ^whsec_[A-Za-z0-9]+$; a malformed or absent value
      makes readStripeConfig() throw or report unconfigured, and the route
      answers 503 without acking rather than run with a half-set secret.
    plane: gftb-platform-stripe-testmode (this file's `secrets:` block)
    custody: >-
      Operator (Jess) — minted per-endpoint in the Stripe dashboard
      (jess@sulliwood.org account) at the same sitting the endpoint URL
      (https://staging.greatfallstoolbus.org/api/stripe/webhook) is
      registered with Stripe. Never agent-handled.
    rotation: >-
      Rotating this value is coupled to Stripe's own endpoint record: Stripe
      issues a NEW whsec_ secret only if the endpoint is re-created or its
      secret is explicitly rolled from the dashboard, and old in-flight
      deliveries signed with the prior secret would then fail verification.
      Rotate on suspected exposure; otherwise treat as stable for the life of
      the registered endpoint. Because verification is the sole security
      boundary once the path is Access-exempt (design note), an exposed value
      here is a live incident, not a routine rotation.
    consumed_by:
      - deployment-web.yaml (STRIPE_WEBHOOK_SECRET env, optional secretKeyRef)
      - deployment-worker.yaml (STRIPE_WEBHOOK_SECRET env, optional secretKeyRef; the worker does not serve the route but shares the Secret object)
    minted_by: NOT YET — deferred to the TIN-3818 rails sitting (see `secrets:` above)

  - name: STRIPE_PUBLISHABLE_KEY
    purpose: >-
      Browser-side Stripe.js publishable key. Not secret in the
      confidentiality sense (Stripe designs pk_* keys to be embedded in
      client-side JS), but named-only here for the same reason config.ts
      shape-enforces it (^pk_test_[A-Za-z0-9]+$): a live-shaped value would
      make the checkout UI collect real card data against a test-mode
      backend, a fail-closed app-side refusal, not a network-boundary one.
    plane: gftb-platform-stripe-testmode (this file's `secrets:` block)
    custody: >-
      Operator (Jess) — same Stripe test-mode account (jess@sulliwood.org) as
      the two keys above; paired with STRIPE_SECRET_KEY at mint time (both
      come from the same API-keys dashboard page).
    rotation: >-
      Freely rotatable; since it is client-visible by design, treat exposure
      as routine rather than incident-grade — rotate opportunistically
      alongside STRIPE_SECRET_KEY, not on its own urgency.
    consumed_by:
      - deployment-web.yaml (STRIPE_PUBLISHABLE_KEY env, optional secretKeyRef)
      - deployment-worker.yaml (STRIPE_PUBLISHABLE_KEY env, optional secretKeyRef; unused at runtime — the worker never renders checkout UI — carried only because it shares the Secret object)
    minted_by: NOT YET — deferred to the TIN-3818 rails sitting (see `secrets:` above)

  - name: GFTB_TENANT_ID
    purpose: >-
      The one configured tenant's UUID, read by the app for RLS transaction
      scoping (TIN-3817 hand-off row; app half worker.ts / outbox/dispatch.ts
      headers). NOT a Secret object — a plain env `value:`, committed today
      as the PLACEHOLDER-GFTB-TENANT-ID sentinel `validate-platform-stack.sh`
      requires, substituted by `just platform-release-render` from an
      operator-supplied GFTB_TENANT_ID under a UUID-shape guard. Listed here
      because it is config-REVIEW material, not because it is confidential:
      RLS enforces "one tenant per transaction", never "the RIGHT tenant", so
      a wrong-but-real UUID silently serves another tenant's rows rather than
      failing — the review discipline is the safeguard, not secrecy.
    plane: n/a — plain Deployment env value, not a Secret; sentinel guarded by scripts/validate-platform-stack.sh
    custody: >-
      Operator (Jess) — the UUID is minted once, when #118's migration seeds
      the tenant row (runbook Step M), and reviewed into the committed pin
      (follow-up: commit the reviewed UUID in place of the sentinel once
      minted).
    rotation: >-
      Not a rotatable credential — it identifies a row, it does not
      authenticate anything. "Rotation" here means re-pointing the whole
      stack at a different tenant, which is a data-migration event, not a
      routine secret rotation, and goes through the same render/plan/apply
      receipt chain as any other pin change.
    consumed_by:
      - deployment-web.yaml (GFTB_TENANT_ID env, plain value)
      - deployment-worker.yaml (GFTB_TENANT_ID env, plain value)
    minted_by: docs/runbooks/staging-platform-serving.md Step M (member-db migration seeds the tenant row)

  - name: DATABASE_URL
    purpose: >-
      libpq DSN (sslmode=verify-full) for the DML-only gftb_app role. This
      env var name is what web/worker actually read; the Secret behind it is
      gftb-member-db-runtime-dsn, defined and governed by this file's
      `secrets:` block above and ultimately derived from the member-db
      contract's gftb-member-db-runtime (../member-db/secrets.contract.yaml,
      PR #118). This entry exists so the env-var name a reader greps the
      Deployment for and the Secret name that actually backs it are both
      documented at the same idiom-level as the Stripe rows above; it is a
      cross-reference, not a second definition.
    plane: gftb-member-db-runtime-dsn (this file's `secrets:` block; ultimately gftb-member-db-runtime, ../member-db/secrets.contract.yaml)
    custody: >-
      Operator (Jess) — derived at docs/runbooks/staging-platform-serving.md
      Step C1 from the member-db contract's operator-minted runtime
      credential (PR #118 Step C2). Never agent-minted or agent-read.
    rotation: >-
      Rotation follows the member-db contract: rotating the gftb_app role
      password (../member-db/secrets.contract.yaml) means re-deriving this
      DSN Secret at Step C1 and rolling web+worker. NEVER the owner/DDL DSN
      (gftb-member-db-migrator-dsn) — validate-platform-stack.sh fails this
      stack if that name appears anywhere in it (the two-credential boundary
      this file's header documents).
    consumed_by:
      - deployment-web.yaml (DATABASE_URL env, secretKeyRef gftb-member-db-runtime-dsn/dsn)
      - deployment-worker.yaml (DATABASE_URL env, secretKeyRef gftb-member-db-runtime-dsn/dsn)
    minted_by: docs/runbooks/staging-platform-serving.md Step C1
