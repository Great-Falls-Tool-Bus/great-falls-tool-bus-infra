apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: members-greatfallstoolbus-org-production

# DECLARE-ONLY — MERGING APPLIES NOTHING (TIN-3815 / TIN-3817).
# GFTB platform staging serving stack: web + worker Deployments and the web
# ClusterIP Service behind the fail-closed staging.greatfallstoolbus.org route
# intent, plus the namespace's default-deny NetworkPolicy family.
# `kubectl kustomize` MUST render this cleanly (`just platform-stack-validate`
# renders it). Git owns the exact immutable image receipt in both Deployments:
# ghcr.io/great-falls-tool-bus/greatfallstoolbus.org@sha256:10f853938dc6823afe8c9bdc54943587f963d22117aafd17247350b2b5712b35
# The attended release chain accepts only the reviewed tenant UUID, records the
# rendered bytes, dry-runs them, and applies those same bytes. This stack creates
# no Namespace and ships no Secret; the pre-rollout migration Job template that
# shares this namespace belongs to k8s/member-db (PR #118), is one-shot
# `generateName` state, and is not reconciled here.

resources:
  - deployment-web.yaml
  - deployment-worker.yaml
  - service-web.yaml
  - networkpolicy.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: great-falls-tool-bus-infra
      app.kubernetes.io/part-of: great-falls-tool-bus
      app.tinyland.dev/tenant: great-falls-tool-bus
