# DECLARE-ONLY — NOT APPLIED. NAMES-ONLY (TIN-4062 m1: platform mail
# transport provisioning). Delivery stays OFF: nothing in this file mints a
# value, flips GFTB_MAIL_DELIVERY, or opens a socket. See
# docs/runbooks/platform-mail-transport.md for the full activation chain and
# the spec §7 automation gate that fences it.
#
# SCOPE. The greatfallstoolbus.org app repo's mail leg (PR #208,
# feat/member-v0-mail-leg, TIN-4062) reads three names at process start,
# fail-closed (src/lib/server/mail/config.ts readMailConfig — all three or
# none, never a degraded mode):
#   GFTB_MAIL_DELIVERY      must be exactly "enabled". An operator-flipped
#                           literal on the Deployment, not a Secret — this
#                           file does not name a Secret for it because it
#                           carries no credential material.
#   GFTB_MAIL_SMTP_URL      smtp(s)://user:pass@host:port. The SASL
#                           credential travels INSIDE this one DSN string
#                           (src/lib/server/mail/delivery.ts SmtpDelivery
#                           issues AUTH LOGIN only when the DSN carries a
#                           user:pass), not as a second, separate key.
#   GFTB_MAIL_FROM_ADDRESS  the envelope/header From address.
# This file names the Secret those two provisioned values resolve to, plus
# the underlying submission identity (the "SASL credential") the DSN embeds,
# following this repo's names-only custody idiom (k8s/web/secrets.contract.yaml:
# no values, no ciphertext, no endpoints — planes, owners, rotation, consumer).
#
# TARGET NAMESPACE. members-greatfallstoolbus-org-production — the platform
# namespace infra PR #121 (feat/tin-3815-staging-platform-serving, TIN-3815/
# TIN-3817) declares. #121 is UNMERGED as of 2026-08-29. This PR is based on
# main, which has no k8s/platform/ yet, so this file and its sibling
# networkpolicy.yaml are staged in their own directory
# (k8s/platform-mail-transport/) rather than inside k8s/platform/ — that
# avoids a direct path collision with #121's own
# k8s/platform/secrets.contract.yaml (which already declares
# gftb-member-db-runtime-dsn and gftb-platform-stripe-testmode in this exact
# SecretContract shape).
#
# THE FOLLOW-UP, once #121 merges: fold spec.secrets' one entry below into
# #121's k8s/platform/secrets.contract.yaml as one more entry in the same
# list, fold spec.related's two entries into whatever sibling list #121's
# contract adopts for names that are not k8s Secrets (see the spec.related
# header comment below for why they cannot join spec.secrets as-is), fold
# networkpolicy.yaml's one NetworkPolicy object into #121's
# k8s/platform/members-greatfallstoolbus-org-production/networkpolicy.yaml as
# a sixth object alongside its default-deny-egress / allow-egress-dns /
# allow-egress-member-db family, then delete this directory. Nothing here
# needs #121 applied first to be correct: these are additive "allow" rules
# and inert names-only declarations either way, and every object in this
# whole tree stays declare-only regardless of merge order.
apiVersion: v1
kind: SecretContract
metadata:
  name: gftb-platform-mail-transport-secrets-contract
  namespace: members-greatfallstoolbus-org-production
spec:
  secrets:
    - name: gftb-platform-mail-smtp
      namespace: members-greatfallstoolbus-org-production
      origin: operator-minted
      type: Opaque
      keys: ["url"]
      role: platform-mail-submission
      authority: >-
        The full smtp(s):// DSN GFTB_MAIL_SMTP_URL resolves to, including the
        embedded SASL user:pass for AUTH LOGIN against the substrate relay.
        Points at the existing substrate postfix relay
        postfix.tinyland-dev-production.svc.cluster.local:587 (STARTTLS +
        SASL) — the SAME relay the Mailman list stack already authenticates
        to (k8s/list/latoolb-us-production/mailaccount-lists-bounces.yaml,
        docs/runbooks/list-bringup.md "Contract capability #2"). This Secret
        carries a NEW submission identity on that relay, not a reuse of
        lists-bounces@latoolb.us — see gftb-platform-mail-sasl-identity below
        for why reuse is rejected.
      rotation: >-
        Rotate by re-minting the underlying MailAccount credential (same
        discipline list-bringup.md documents for lists-bounces-smtp: the
        account controller generates the password, an operator projects it
        into the Secret out of band — nobody hand-mints it) and overwriting
        this Secret's url key in one operator step. The app reads the env var
        once at process start, so a rotation requires a worker rollout, not
        just a Secret edit.
      consumed_by:
        - "deployment-worker.yaml (GFTB_MAIL_SMTP_URL) — the only mail sender; see authority"
      never_consumed_by:
        - "deployment-web.yaml — the web pod never sends mail"
        - "the pre-rollout migration Job (k8s/member-db/.../job-migrator.template.yaml, PR #118)"
      minted_by: docs/runbooks/platform-mail-transport.md step 3

  # NAMES THAT ARE NOT K8S SECRETS. spec.secrets above is reserved for real
  # SecretContract rows (a genuine type:/keys: pair, per #121's
  # k8s/platform/secrets.contract.yaml convention). The two rows below are
  # tracked here because config.ts's fail-closed guard treats them as part
  # of the same activation unit as gftb-platform-mail-smtp, but neither one
  # names a k8s Secret, so neither gets a type:/keys: pair — widening those
  # fields to mean "any name" would break the moment a future validator
  # asserts anything typed about spec.secrets[]. Fold target on the #121
  # side TBD (a sibling spec.related list, or #121's own equivalent).
  related:
    - name: gftb-platform-mail-sasl-identity
      namespace: latoolb-us-production
      origin: name-undecided-operator-decision-not-yet-minted
      kind: mail.tinyland.dev/v1alpha1 MailAccount
      role: submission-identity
      authority: >-
        A dedicated MailAccount under latoolb.us, minted the same way
        lists-bounces was (docs/mail-cr-apply-runbook.md;
        k8s/list/latoolb-us-production/mailaccount-lists-bounces.yaml: no
        passwordSecretRef committed, the account controller generates the
        initial credential on first reconcile, an operator projects it out of
        band). The local-part (some address at latoolb.us) is an operator
        naming decision — searched meta spec/decisions/Linear as of
        2026-08-29 and found NO ratified value; this file does not invent
        one. Reusing keyholders@latoolb.us or lists-bounces@latoolb.us is
        rejected: both are purpose-scoped identities (access-gating role
        list; list-engine bounce/VERP submission), and handing a third,
        unrelated consumer their credential would widen what a leak of
        either one exposes.
      consumed_by:
        - "embedded as the user:pass half of gftb-platform-mail-smtp's url value"
      never_consumed_by:
        - "keyholders@latoolb.us's credential"
        - "lists-bounces@latoolb.us's credential"
      minted_by: >-
        A NEW k8s/mail/latoolb-us-production/mailaccount-*.yaml CR this repo
        does not yet declare. Out of m1's scope (m1 is names/declarations
        only); minting that CR, choosing the local-part, and wiring its
        generated credential into gftb-platform-mail-smtp are the operator's
        next provisioning step, in that order.

    - name: gftb-platform-mail-from-address
      namespace: members-greatfallstoolbus-org-production
      origin: operator-set-non-secret
      kind: Plain Deployment env value or ConfigMap key
      env_var: GFTB_MAIL_FROM_ADDRESS
      role: display/envelope From address
      authority: >-
        Read by src/lib/server/mail/config.ts's readMailConfig alongside
        GFTB_MAIL_DELIVERY and GFTB_MAIL_SMTP_URL. A DSN present with no
        From address (or the reverse) throws MailConfigError rather than
        sending in a degraded shape. Must be a latoolb.us address the
        identity above is authorized to send as, or the relay's SPF/DKIM
        alignment for latoolb.us breaks even though the SMTP dialogue itself
        succeeds. No value is committed here for the same reason as the SASL
        identity: none is ratified anywhere in meta as of 2026-08-29.
      consumed_by:
        - "deployment-worker.yaml (GFTB_MAIL_FROM_ADDRESS)"
      never_consumed_by: []
      minted_by: "operator, alongside step 3"

  # Consumed by reference, defined and governed elsewhere — listed for
  # inventory completeness only, following #121's own secrets.contract.yaml
  # convention of cross-referencing rather than restating:
  #   GFTB_MAIL_DELIVERY   Deployment env literal, not a Secret at all —
  #                        set at docs/runbooks/platform-mail-transport.md
  #                        step 5, never a default-on value anywhere this
  #                        repo's own validators or CI run.
  #   gftb-member-db-runtime-dsn / gftb-platform-stripe-testmode
  #                        k8s/platform/secrets.contract.yaml (#121) — the
  #                        sibling names this file's family will fold next to.
