# Persistent volumes for the Mailman 3 stack. Sized for a tiny community org
# (single small list).
#
# SUBSTRATE-OWNED MIGRATION DEBT (TIN-4246 rung 5; substrate-boundary contract
# 2026-08-31): `local-path-retain` is a provider StorageClass name owned by the
# cluster substrate (blahaj), not by this consumer overlay. The cluster
# publishes no default StorageClass and no class-alias mechanism today, so the
# raw class literal stays pinned here; swap it for the substrate-published
# alias when one exists. Retain semantics are load-bearing: list DB + archive +
# subscriber state must survive a PVC reclaim, matching the house mail-data
# pattern (tinyland-dev-production mail replicas use *-retain classes).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailman-postgres-data
  namespace: latoolb-us-production
  labels:
    app.kubernetes.io/name: mailman-postgres
    app.kubernetes.io/component: database
spec:
  storageClassName: local-path-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailman-core-data
  namespace: latoolb-us-production
  labels:
    app.kubernetes.io/name: mailman-core
    app.kubernetes.io/component: list-engine
spec:
  storageClassName: local-path-retain
  # Message store + queue (/opt/mailman) must survive restarts.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailman-web-data
  namespace: latoolb-us-production
  labels:
    app.kubernetes.io/name: mailman-web
    app.kubernetes.io/component: web
spec:
  storageClassName: local-path-retain
  # HyperKitty full-text search index + collected static + uploads.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
