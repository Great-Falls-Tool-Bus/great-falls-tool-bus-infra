# Consumer-owned desired state for TIN-4268. This ConfigMap is inert until the
# ratified purpose-bound in-cluster projection transaction consumes it. Source
# presence is not activation and does not prove the live Mailman database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: discuss-list-policy-intent
  namespace: latoolb-us-production
  labels:
    app.kubernetes.io/name: mailman-core
    app.kubernetes.io/component: list-policy-intent
  annotations:
    greatfallstoolbus.org/authority: TIN-4268
data:
  list_id: discuss.latoolb.us
  archive_policy: public
  subscription_policy: moderate
  default_nonmember_action: hold
  advertised: "true"
  writer_admission: active-member-provisioning-only
