# NAMES-ONLY SECRET CONTRACT for the GFTB member database substrate (TIN-3817).
#
# This file carries NO VALUES and never will. It mirrors
# ../web/secrets.contract.yaml: the manifests reference credentials by name, and
# this is the public record of which names exist, who mints them, who consumes
# them, and what authority each one carries. `just secrets-scan-dir` (gitleaks)
# and scripts/validate-member-db-stack.sh both run against it.
#
# THE WHOLE POINT OF THIS FILE is the last column of the table below: two
# credentials reach the same database with deliberately different authority.
# TIN-3817 acceptance row 2 and system spec S6 both require that separation, and
# the way it is enforced is that no single workload is ever handed both.
apiVersion: v1
kind: SecretContract
metadata:
  name: member-db-secrets-contract
  namespace: members-greatfallstoolbus-org-db-production
spec:
  secrets:
    - name: gftb-member-db-app
      namespace: members-greatfallstoolbus-org-db-production
      origin: cnpg-generated
      type: kubernetes.io/basic-auth
      keys: [username, password, dbname, host, port, uri, jdbc-uri]
      role: gftb_migrator
      authority: >-
        OWNER of database gftb_member. Full DDL. This is the narrow migration
        credential; it is generated inside the cluster by the CNPG operator at
        bootstrap and no operator action creates or reads its value.
      consumed_by:
        - the pre-rollout migration Job, indirectly, via gftb-member-db-migrator-dsn
      never_consumed_by:
        - the platform web Deployment
        - the platform worker Deployment

    - name: gftb-member-db-runtime
      namespace: members-greatfallstoolbus-org-db-production
      origin: operator-minted
      type: kubernetes.io/basic-auth
      keys: [username, password]
      role: gftb_app
      authority: >-
        DML ONLY on database gftb_member. No DDL, no ownership, and
        bypassrls: false so row-level security is not optional for it. Bound to
        the role by the managed.roles passwordSecret reference in cluster.yaml.
      consumed_by:
        - the platform web Deployment
        - the platform worker Deployment
      never_consumed_by:
        - the pre-rollout migration Job
      minted_by: docs/runbooks/member-db-bringup.md step C2

    - name: gftb-member-db-migrator-dsn
      namespace: members-greatfallstoolbus-org-production
      origin: operator-minted
      type: Opaque
      keys: [dsn]
      role: gftb_migrator
      authority: >-
        The owner credential expressed as a libpq DSN, placed in the PLATFORM
        namespace because that is where the migration Job runs. It is a
        derivative of gftb-member-db-app, not a second credential; rotating the
        owner password means re-deriving this Secret.
      consumed_by:
        - job-migrator.template.yaml (DATABASE_URL)
      minted_by: docs/runbooks/member-db-bringup.md step M1

    - name: gftb-member-db-backup-s3
      namespace: members-greatfallstoolbus-org-db-production
      origin: operator-minted
      type: Opaque
      keys: [ACCESS_KEY_ID, ACCESS_SECRET_KEY]
      authority: >-
        Object-store credential for continuous WAL archiving and scheduled base
        backups. Scoped to the gftb-member-db-backups bucket only. This is the
        credential the RPO<=1h / RTO<=4h acceptance row depends on: if it is
        absent or wrong, archive_command fails and WAL accumulates on the
        dedicated walStorage volume until the primary stops. Under the B1
        ruling (2026-08-20) this authenticates the CNPG barmanObjectStore
        client to the GFTB-owned rustfs Service declared in rustfs.yaml, not
        an estate-owned tcfs endpoint. Its value must be minted identically to
        gftb-member-db-backup-store-root below — see that entry.
      minted_by: docs/runbooks/member-db-bringup.md step B2

    - name: gftb-member-db-backup-store-root
      namespace: members-greatfallstoolbus-org-db-production
      origin: operator-minted
      type: Opaque
      keys: [RUSTFS_ACCESS_KEY, RUSTFS_SECRET_KEY]
      authority: >-
        Root credential for the in-namespace rustfs object-store server
        (rustfs.yaml) that backs member-PII WAL/base-backup storage — the
        GFTB-owned store the B1 ruling (2026-08-20, docs/runbooks/member-db-
        bringup.md) put in place of either tcfs endpoint. This is ONE
        credential expressed under two Secret/key-naming conventions, not two
        independent ones: the rustfs server's own root access key/secret MUST
        carry the same key pair as gftb-member-db-backup-s3's
        ACCESS_KEY_ID/ACCESS_SECRET_KEY, because that is the credential the
        CNPG barmanObjectStore client authenticates to this exact server with.
        Minted together, in the same ceremony, or the two Secrets silently
        drift apart and WAL archiving starts failing authentication.
      consumed_by:
        - the rustfs StatefulSet (rustfs.yaml, envFrom)
      never_consumed_by:
        - the platform web Deployment
        - the platform worker Deployment
        - the pre-rollout migration Job
      minted_by: docs/runbooks/member-db-bringup.md step B2 (same ceremony as gftb-member-db-backup-s3)

  # CNPG also generates gftb-member-db-ca, gftb-member-db-server and
  # gftb-member-db-replication for in-cluster TLS. They are listed here for
  # completeness of the inventory; nothing in this repo references them, and no
  # operator action creates them.
  cnpg_managed_tls_secrets:
    - gftb-member-db-ca
    - gftb-member-db-server
    - gftb-member-db-replication
