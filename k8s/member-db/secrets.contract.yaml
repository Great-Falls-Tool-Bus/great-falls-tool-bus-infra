# NAMES-ONLY SECRET CONTRACT for the GFTB member database substrate (TIN-3817).
#
# This file carries NO VALUES and never will. It mirrors
# ../web/secrets.contract.yaml: the manifests reference credentials by name, and
# this is the public record of which names exist, who mints them, who consumes
# them, and what authority each one carries. `just secrets-scan-dir` (gitleaks)
# and scripts/validate-member-db-stack.sh both run against it.
#
# THE WHOLE POINT OF THIS FILE is the last column of the table below: two
# credentials reach the same database with deliberately different authority.
# TIN-3817 acceptance row 2 and system spec S6 both require that separation, and
# the way it is enforced is that no single workload is ever handed both.
apiVersion: v1
kind: SecretContract
metadata:
  name: member-db-secrets-contract
  namespace: members-greatfallstoolbus-org-db-production
spec:
  secrets:
    - name: gftb-member-db-app
      namespace: members-greatfallstoolbus-org-db-production
      origin: cnpg-generated
      type: kubernetes.io/basic-auth
      keys: [username, password, dbname, host, port, uri, jdbc-uri]
      role: gftb_migrator
      authority: >-
        OWNER of database gftb_member. Full DDL. This is the narrow migration
        credential; it is generated inside the cluster by the CNPG operator at
        bootstrap and no operator action creates or reads its value.
      consumed_by:
        - the pre-rollout migration Job, indirectly, via gftb-member-db-migrator-dsn
      never_consumed_by:
        - the platform web Deployment
        - the platform worker Deployment

    - name: gftb-member-db-runtime
      namespace: members-greatfallstoolbus-org-db-production
      origin: operator-minted
      type: kubernetes.io/basic-auth
      keys: [username, password]
      role: gftb_app
      authority: >-
        DML ONLY on database gftb_member. No DDL, no ownership, and
        bypassrls: false so row-level security is not optional for it. Bound to
        the role by the managed.roles passwordSecret reference in cluster.yaml.
      consumed_by:
        - the platform web Deployment
        - the platform worker Deployment
      never_consumed_by:
        - the pre-rollout migration Job
      minted_by: docs/runbooks/member-db-bringup.md step C2

    - name: gftb-member-db-migrator-dsn
      namespace: members-greatfallstoolbus-org-production
      origin: operator-minted
      type: Opaque
      keys: [dsn]
      role: gftb_migrator
      authority: >-
        The owner credential expressed as a libpq DSN, placed in the PLATFORM
        namespace because that is where the migration Job runs. It is a
        derivative of gftb-member-db-app, not a second credential; rotating the
        owner password means re-deriving this Secret.
      consumed_by:
        - job-migrator.template.yaml (DATABASE_URL)
      minted_by: docs/runbooks/member-db-bringup.md step M1

    - name: ghcr-pull
      namespace: members-greatfallstoolbus-org-production
      origin: operator-provisioned
      type: kubernetes.io/dockerconfigjson
      keys: [.dockerconfigjson]
      authority: >-
        Pull-only registry credential for the exact
        ghcr.io/great-falls-tool-bus/greatfallstoolbus.org image pinned by the
        migration Job. Only gftb-site is authorized public; this contract makes
        no claim that the app package is private until independently observed.
      consumed_by:
        - job-migrator.template.yaml (this carrier)
      pending_consumers:
        - platform web Deployment (PR #121; must reference this definition)
        - platform worker Deployment (PR #121; must reference this definition)
      never_consumed_by:
        - database or object-store pods
      apply_prerequisite: member-db-platform-image-pull-prerequisite
      provisioned_by: operator in the platform namespace; value never enters git

    - name: gftb-member-db-backup-s3
      namespace: members-greatfallstoolbus-org-db-production
      origin: operator-pre-provisioned
      type: Opaque
      keys: [ACCESS_KEY_ID, ACCESS_SECRET_KEY]
      authority: >-
        Least-privilege object read/write authority for continuous WAL
        archiving, scheduled base backups, and restore rehearsal against only
        the gftb-member-db-backups bucket. It is never the rustfs root
        credential and carries no server-admin, identity-management,
        bucket-create, bucket-delete, or other-bucket authority.
      scope:
        resource: bucket
        bucket: gftb-member-db-backups
        permissions: [list, read, write]
        denied:
          [admin, identity-management, bucket-create, bucket-delete, other-buckets]
      required_annotations:
        app.tinyland.dev/object-store-scope: bucket:gftb-member-db-backups
        app.tinyland.dev/object-store-authority: object-read-write-no-admin
        app.tinyland.dev/object-store-proof: nonempty
      apply_prerequisite: member-db-cluster-prerequisites
      consumed_by:
        - the primary CNPG Cluster
        - the restore rehearsal CNPG Cluster
      never_consumed_by:
        - the rustfs StatefulSet
        - the bucket-create Job
        - platform web, worker, or migrator workloads
      provisioned_by: >-
        operator-controlled rustfs IAM ceremony documented in
        docs/runbooks/member-db-bringup.md step B2; no provisioning command or
        value is invented by this public carrier

    - name: gftb-member-db-backup-store-root
      namespace: members-greatfallstoolbus-org-db-production
      origin: operator-minted
      type: Opaque
      keys: [RUSTFS_ACCESS_KEY, RUSTFS_SECRET_KEY]
      authority: >-
        Server-bootstrap/admin credential for the dedicated rustfs process and
        the one-shot bucket-create Job only. It is explicitly excluded from
        CNPG backup/restore acceptance authority and must be distinct from
        gftb-member-db-backup-s3.
      scope:
        resource: server-bootstrap
        excluded_from_backup_acceptance_authority: true
      consumed_by:
        - the rustfs StatefulSet (rustfs.yaml, envFrom)
        - the bucket-create Job (bucket-create.template.yaml, envFrom)
      never_consumed_by:
        - the primary or restore CNPG Cluster
        - the platform web Deployment
        - the platform worker Deployment
        - the pre-rollout migration Job
      minted_by: docs/runbooks/member-db-bringup.md step B2

  # CNPG also generates gftb-member-db-ca, gftb-member-db-server and
  # gftb-member-db-replication for in-cluster TLS. They are listed here for
  # completeness of the inventory; nothing in this repo references them, and no
  # operator action creates them.
  cnpg_managed_tls_secrets:
    - gftb-member-db-ca
    - gftb-member-db-server
    - gftb-member-db-replication
