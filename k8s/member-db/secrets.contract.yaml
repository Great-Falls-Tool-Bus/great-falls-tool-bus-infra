# Names-only credential contract for the GFTB member database (TIN-3817).
#
# This public consumer overlay carries no values or provisioning mechanism.
# Any future protected owner transaction must supply the values; manifests here
# reference only stable names, Kubernetes types and keys, roles, authority, and
# consumers.
apiVersion: v1
kind: SecretContract
metadata:
  name: member-db-secrets-contract
  namespace: members-greatfallstoolbus-org-db-production
spec:
  secrets:
    - name: gftb-member-db-app
      namespace: members-greatfallstoolbus-org-db-production
      type: kubernetes.io/basic-auth
      keys: [username, password, dbname, host, port, uri, jdbc-uri]
      role: gftb_migrator
      authority: >-
        OWNER of database gftb_member with DDL authority. The CNPG cluster
        generates this credential; application runtimes never receive it.
      consumed_by:
        - the pre-rollout migration Job, indirectly through gftb-member-db-migrator-dsn
      never_consumed_by:
        - the platform web Deployment
        - the platform worker Deployment

    - name: gftb-member-db-runtime
      namespace: members-greatfallstoolbus-org-db-production
      type: kubernetes.io/basic-auth
      keys: [username, password]
      role: gftb_app
      authority: >-
        DML-only access to database gftb_member. No DDL, ownership, superuser,
        or row-level-security bypass authority.
      consumed_by:
        - the platform web Deployment
        - the platform worker Deployment
      never_consumed_by:
        - the pre-rollout migration Job

    - name: gftb-member-db-migrator-dsn
      namespace: members-greatfallstoolbus-org-production
      type: Opaque
      keys: [dsn]
      role: gftb_migrator
      authority: >-
        The migration-owner credential expressed as a libpq DSN in the
        platform namespace and scoped to the pre-rollout Job.
      consumed_by:
        - job-migrator.template.yaml (DATABASE_URL)
      never_consumed_by:
        - the platform web Deployment
        - the platform worker Deployment

    - name: ghcr-pull
      namespace: members-greatfallstoolbus-org-production
      type: kubernetes.io/dockerconfigjson
      keys: [.dockerconfigjson]
      role: registry_pull
      authority: >-
        Pull-only access to the private
        ghcr.io/great-falls-tool-bus/greatfallstoolbus.org image. Credential
        bytes must come from protected owner authority and never enter this tree.
      consumed_by:
        - job-migrator.template.yaml
        - the platform web Deployment
        - the platform worker Deployment
      never_consumed_by:
        - database or object-store pods

    - name: gftb-member-db-backup-s3
      namespace: members-greatfallstoolbus-org-db-production
      type: Opaque
      keys: [ACCESS_KEY_ID, ACCESS_SECRET_KEY]
      role: backup_object_rw
      authority: >-
        Object read/write authority for continuous WAL archiving, base
        backups, and restore against only the gftb-member-db-backups bucket.
        It carries no server-admin, identity-management, bucket-create,
        bucket-delete, or other-bucket authority.
      scope:
        resource: bucket
        bucket: gftb-member-db-backups
        permissions: [list, read, write]
        denied:
          [admin, identity-management, bucket-create, bucket-delete, other-buckets]
      required_annotations:
        app.tinyland.dev/object-store-scope: bucket:gftb-member-db-backups
        app.tinyland.dev/object-store-authority: object-read-write-no-admin
        app.tinyland.dev/object-store-proof: nonempty
      consumed_by:
        - the primary CNPG Cluster
        - the restore rehearsal CNPG Cluster
      never_consumed_by:
        - the rustfs StatefulSet
        - the bucket-create Job
        - platform web, worker, or migrator workloads

    - name: gftb-member-db-backup-store-root
      namespace: members-greatfallstoolbus-org-db-production
      type: Opaque
      keys: [RUSTFS_ACCESS_KEY, RUSTFS_SECRET_KEY]
      role: object_store_bootstrap
      authority: >-
        Bootstrap/admin authority for the dedicated object store and bucket
        initialization Job only. It is excluded from backup and restore
        acceptance authority and must differ from gftb-member-db-backup-s3.
      scope:
        resource: server-bootstrap
        excluded_from_backup_acceptance_authority: true
      consumed_by:
        - the rustfs StatefulSet
        - the bucket-create Job
      never_consumed_by:
        - the primary or restore CNPG Cluster
        - the platform web Deployment
        - the platform worker Deployment
        - the pre-rollout migration Job

  cnpg_managed_tls_secrets:
    - gftb-member-db-ca
    - gftb-member-db-server
    - gftb-member-db-replication
