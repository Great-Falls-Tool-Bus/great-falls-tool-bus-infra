# DECLARE-ONLY — MERGING APPLIES NOTHING (TIN-3817, Member v0 slice S1 infra half).
#
# The restore rehearsal Cluster for runbook step R — the RTO<=4h acceptance
# row is not met by declaring a backup, it is met by restoring one and timing
# it (B-5, PR #118 review round). This is a SECOND Cluster, never applied
# over the live one, recovering from the same rustfs backup store via
# bootstrap.recovery + externalClusters rather than bootstrap.initdb.
#
# WHY THIS NOW WORKS. Before B-5, networkpolicy.yaml's
# allow-cnpg-operator-ingress and allow-cnpg-to-backup-store-ingress admitted
# only cnpg.io/cluster: gftb-member-db — a label THIS Cluster's pods do not
# carry (CNPG sets cnpg.io/cluster to the Cluster's own name, so these pods
# carry gftb-member-db-restore). The operator could never reach the restore
# instance manager, and the restore pods could never read the backups they
# exist to restore. Both policies now admit gftb-member-db-restore too, by
# name, alongside the primary.
#
# NOT A KUSTOMIZATION MEMBER. Same reasoning as job-migrator.template.yaml
# and bucket-create.template.yaml: this is a one-shot rehearsal artifact, not
# stack state, and reconciling it via kustomize would try to keep the
# rehearsal cluster alive permanently instead of letting the operator tear it
# down (runbook step R5 / `just member-db-restore-rehearsal-teardown`).
#
# POINT-IN-TIME TARGET. Left unset here: CNPG recovers to the latest
# available WAL when `recoveryTarget` is absent, which is both the common
# case for an RTO rehearsal and the simplest thing to time honestly. An
# operator who wants a specific `targetTime` adds
# `bootstrap.recovery.recoveryTarget.targetTime` to their own operator-local
# copy before applying — this stays a reviewed template, never a place a
# real timestamp needs to be committed.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gftb-member-db-restore
  namespace: members-greatfallstoolbus-org-db-production
  labels:
    app.kubernetes.io/name: gftb-member-db-restore
    app.kubernetes.io/component: database-restore-rehearsal
    app.kubernetes.io/part-of: great-falls-tool-bus
    app.tinyland.dev/lifecycle: declare-only
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql@sha256:e38d10bb2c7420e62efe9afabf207c005d93cdcf30f19f692d047f7dc660271e
  imagePullPolicy: IfNotPresent
  instances: 1
  enableSuperuserAccess: false
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: restart

  bootstrap:
    recovery:
      source: gftb-member-db-origin

  externalClusters:
    - name: gftb-member-db-origin
      barmanObjectStore:
        destinationPath: s3://gftb-member-db-backups/
        # The PRIMARY cluster's serverName — this is what tells barman-cloud
        # which server's WAL/base-backup objects inside the shared bucket to
        # read. Never gftb-member-db-restore; that would look for a restore
        # of a restore.
        serverName: gftb-member-db
        endpointURL: http://gftb-member-db-backup-store.members-greatfallstoolbus-org-db-production.svc.cluster.local:9000
        s3Credentials:
          accessKeyId:
            name: gftb-member-db-backup-s3
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: gftb-member-db-backup-s3
            key: ACCESS_SECRET_KEY

  storage:
    size: 20Gi
    storageClass: openebs-bumble-postgresql-retain
  walStorage:
    size: 10Gi
    storageClass: openebs-bumble-postgresql-retain

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  monitoring:
    enablePodMonitor: false
