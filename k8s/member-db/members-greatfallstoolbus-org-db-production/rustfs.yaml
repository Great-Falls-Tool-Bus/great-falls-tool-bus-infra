# GFTB backup-store desired state (TIN-3817, Member v0 S1 infra half).
#
# This dedicated object store holds member-database WAL and base backups. The
# 2026-08-20 B1 ruling rejected both shared tcfs endpoints for member data and
# selected a GFTB-owned store with closed NetworkPolicy and distinct bootstrap
# and bucket-scoped credentials.
#
# The workload pins the exact rustfs image digest:
#   docker.io/rustfs/rustfs:1.0.0-beta.8@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3
# Re-pin only with the matching validator constant. Physical storage and node
# placement are provider-supply inputs and are absent from this consumer carrier.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gftb-member-db-backup-store-data
  namespace: members-greatfallstoolbus-org-db-production
  labels:
    app.kubernetes.io/name: gftb-member-db-backup-store
    app.kubernetes.io/component: object-store
    app.kubernetes.io/part-of: great-falls-tool-bus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # ">=50Gi" per the B1 ruling text. scripts/validate-member-db-stack.sh
      # asserts this parses and is not below 50Gi.
      storage: 50Gi
  volumeMode: Filesystem
---
apiVersion: v1
kind: Service
metadata:
  name: gftb-member-db-backup-store
  namespace: members-greatfallstoolbus-org-db-production
  labels:
    app.kubernetes.io/name: gftb-member-db-backup-store
    app.kubernetes.io/component: object-store
    app.kubernetes.io/part-of: great-falls-tool-bus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gftb-member-db-backup-store
  ports:
    - name: s3
      port: 9000
      protocol: TCP
      targetPort: s3
  sessionAffinity: None
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gftb-member-db-backup-store
  namespace: members-greatfallstoolbus-org-db-production
  labels:
    app.kubernetes.io/name: gftb-member-db-backup-store
    app.kubernetes.io/component: object-store
    app.kubernetes.io/part-of: great-falls-tool-bus
spec:
  serviceName: gftb-member-db-backup-store
  replicas: 1
  # A standalone PVC (above), not volumeClaimTemplates: one object-store
  # identity and no ordinal volume fan-out.
  selector:
    matchLabels:
      app.kubernetes.io/name: gftb-member-db-backup-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gftb-member-db-backup-store
        app.kubernetes.io/component: object-store
        app.kubernetes.io/part-of: great-falls-tool-bus
    spec:
      automountServiceAccountToken: false
      restartPolicy: Always
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Normalize ownership of a newly mounted data volume before the
        # non-root server starts. The guard avoids a recursive chown on restart
        # when the root ownership is already correct.
        - name: prepare-data-dir
          image: docker.io/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              mkdir -p /data
              owner="$(stat -c '%u:%g' /data 2>/dev/null || true)"
              if [ "$owner" != "10001:10001" ]; then
                chown 10001:10001 /data
              fi
              chmod 2775 /data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            privileged: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: rustfs
          image: docker.io/rustfs/rustfs:1.0.0-beta.8@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --address
            - :9000
            - --console-address
            - :9001
          env:
            - name: RUSTFS_BROWSER
              value: "off"
          # NAME ONLY. This is the rustfs server-bootstrap/admin credential.
          # It is deliberately distinct from the bucket-scoped
          # gftb-member-db-backup-s3 client credential and is excluded from
          # backup/restore acceptance authority.
          envFrom:
            - secretRef:
                name: gftb-member-db-backup-store-root
                optional: false
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gftb-member-db-backup-store-data
