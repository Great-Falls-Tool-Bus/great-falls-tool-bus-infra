# DECLARE-ONLY — NOT APPLIED (TIN-2541).
#
# Default-deny ingress posture with explicit allows, mirroring MI
# (blahaj:tofu/stacks/massageithaca/main.tf: default-deny-ingress + per-source
# allows) and the house form-stack doctrine (k8s/form/.../networkpolicy.yaml:
# the tunnel source is the non-host-networked `cloudflared` namespace, so a
# namespaceSelector on kubernetes.io/metadata.name=cloudflared is the tightest
# correct admission — no ipBlock/SNAT workaround needed on that leg).
#
# The web pod's ONLY public path is: cloudflared (tunnel) --3000--> this pod.
# Prometheus scrape is admitted from the tinyland-dev-production monitoring
# namespace on 3000. Egress is least-privilege: DNS, plus the one explicit
# in-cluster allow the adapter-node origin actually needs — the request-time
# discuss-archive read from the HyperKitty web tier (see the last policy in this
# file). No 0.0.0.0/0, and no other backend.
#
# FAIL-CLOSED note: these policies select on the web pod labels. The Deployment
# ships replicas: 2 and a digest-pinned image, so these rules are NOT inert —
# they take effect whenever the dispatch-gated web-stack.yml runs
# `just web-stack-apply`. What merging this file cannot do is apply anything:
# this stack creates no Namespace (the namespace-scoped web-apply SA cannot
# either), and the public tunnel route stays fail-closed and dashboard-managed.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: greatfallstoolbus-org-production
  labels:
    app.kubernetes.io/part-of: great-falls-tool-bus
    app.tinyland.dev/lifecycle: declare-only
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared-tunnel-ingress
  namespace: greatfallstoolbus-org-production
  labels:
    app.kubernetes.io/name: greatfallstoolbus-org
    app.tinyland.dev/lifecycle: declare-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: greatfallstoolbus-org
      app.kubernetes.io/component: web
  policyTypes: [Ingress]
  ingress:
    # Public edge hop: the in-cluster cloudflared tunnel (non-host-networked
    # pods in the `cloudflared` namespace) forwards solved traffic to :3000.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: greatfallstoolbus-org-production
  labels:
    app.kubernetes.io/name: greatfallstoolbus-org
    app.tinyland.dev/lifecycle: declare-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: greatfallstoolbus-org
      app.kubernetes.io/component: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tinyland-dev-production
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: greatfallstoolbus-org-production
  labels:
    app.kubernetes.io/name: greatfallstoolbus-org
    app.tinyland.dev/lifecycle: declare-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: greatfallstoolbus-org
      app.kubernetes.io/component: web
  policyTypes: [Egress]
  egress:
    - to: [] # cluster DNS only
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# DISCUSS-SNAPSHOT READER egress (greatfallstoolbus.org data plane, ADR 0010).
# Post-cutover (TIN-2543, prerender flipped off) the adapter-node site pod does
# the REQUEST-TIME fetch of the PUBLIC discuss@ archive from the HyperKitty web
# tier in latoolb-us-production. This is the reciprocal of the mailman-core
# web-tier ingress allowance for this namespace (list stack networkpolicy.yaml).
#
# PORT SUBTLETY (same as the archive gate leg): the app dials the mailman-web
# Service on 8080, but NetworkPolicy egress evaluates the POST-DNAT destination
# — the mailman-core pod's real container port 8000 — so this rule targets the
# mailman-core podSelector on 8000, NOT the Service's 8080. Scoped to that one
# pod in that one namespace; no 0.0.0.0/0, no broad egress. This rule belongs to
# the adapter-node origin and is live wherever that origin is applied (the
# Deployment ships replicas: 2 and a digest pin; merging still applies nothing —
# the only apply is the dispatch-gated web-stack.yml). The gftb-site static-origin
# promotion REMOVES it: the reviewed render omits it and `just web-release-apply`
# prunes it together with allow-egress-dns. Build-time prerender fetches do NOT
# use this rule (they run in arc-runners, not this pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-discuss-archive
  namespace: greatfallstoolbus-org-production
  labels:
    app.kubernetes.io/name: greatfallstoolbus-org
    app.tinyland.dev/lifecycle: declare-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: greatfallstoolbus-org
      app.kubernetes.io/component: web
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: latoolb-us-production
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mailman-core
      ports:
        - protocol: TCP
          port: 8000
