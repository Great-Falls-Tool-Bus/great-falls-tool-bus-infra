# DECLARATION ONLY — applied only by the reviewed web-release transaction.
# Internal ClusterIP, port 80 to the gftb-site Caddy origin's named port 3000.
# Public routing belongs to the Cloudflare edge stack, never this Service.
apiVersion: v1
kind: Service
metadata:
  name: greatfallstoolbus-org
  namespace: greatfallstoolbus-org-production
  labels:
    app.kubernetes.io/name: greatfallstoolbus-org
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: great-falls-tool-bus
    app.tinyland.dev/lifecycle: declare-only
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: greatfallstoolbus-org
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
