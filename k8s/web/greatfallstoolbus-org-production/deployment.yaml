# DECLARATION ONLY — applied only by the reviewed web-release transaction.
#
# The tree pins the production `gftb-site` static Caddy origin exactly: two
# replicas, one immutable image digest, and the matching source SHA annotation.
# `web-release-render` emits these committed bytes verbatim and refuses if its
# reviewed WEB_APPLY_IMAGE/WEB_APPLY_SHA inputs differ. The namespace and Secret
# values are external; this workload cannot bootstrap either. See
# k8s/web/README.md and docs/runbooks/oncluster-web-cutover.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greatfallstoolbus-org
  namespace: greatfallstoolbus-org-production
  labels:
    app.kubernetes.io/name: greatfallstoolbus-org
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: great-falls-tool-bus
    app.tinyland.dev/lifecycle: declare-only
spec:
  # ADR 0010 §5 step 3: replicas 2 (MassageIthaca production shape). Nothing
  # schedules on merge — and since TIN-3899 nothing schedules from CI at all;
  # apply is attended-operator-only behind the promotion interlock.
  # Anti-affinity spreads the 2 replicas across distinct nodes (see below).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: greatfallstoolbus-org
      app.kubernetes.io/component: web
  template:
    metadata:
      # Committed release identity (TIN-4254 W13): the full gftb-site source
      # commit behind the digest pinned below. The pin step updates the image
      # digest AND this annotation in the same commit; `web-release-render`
      # refuses to plan when either differs from the reviewed
      # WEB_APPLY_IMAGE/WEB_APPLY_SHA inputs.
      annotations:
        app.tinyland.dev/source-sha: 91cf300ddbe9068379bc7ade462dfcba92053966
      labels:
        app.kubernetes.io/name: greatfallstoolbus-org
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: great-falls-tool-bus
    spec:
      terminationGracePeriodSeconds: 15
      # Pod-level hardening. runAsUser/runAsGroup/fsGroup 65532 is gftb-site's
      # own image default (flake.nix `config.User = "65532:65532"`; the
      # distroless/nonroot convention) and is exactly what Justfile
      # `web-release-render` sets on every rendered release, so this is not an
      # independent choice — it is the value the ceremony has always used.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Node placement. Nothing schedules on merge (apply is dispatch-gated); at
      # cutover the 2 replicas prefer the roomy nodes and spread across hosts.
      #
      # Live-probe grounding (honey rke2, 2026-07-05, read-only kubectl): pod
      # headroom is honey 138/150 (12 free — honey was EXPANDED to 150, not the
      # ~110-cap ADR 0003 assumed), bumble 50/110 (60 free), sting 96/200
      # (104 free); ~176 free cluster-wide. A replicas:2 web Deployment fits
      # trivially, but honey is the TIGHTEST node, so at cutover we PREFER
      # bumble/sting for the serving pods and keep honey as spillover.
      #
      # Serving SPOF is NONE at the pod/node layer: 3-node cluster, node-anti-
      # affinity spreads the 2 replicas across distinct hosts, and on node loss
      # they reschedule (same posture the live cloudflared replicas:2 already
      # runs). The only genuine SPOF is SITE-LEVEL (one on-prem /24: honey
      # .70.10, bumble .11, sting .12) — the honest availability tradeoff vs a
      # global CDN, already accepted by MI in production and fronted+cached by
      # Cloudflare; the named mitigation is a warm CF-Pages standby (ADR 0007).
      # The "sting SPOF" ADR 0003 cites is CI-RUNNER concentration (all ARC/nix
      # runners on sting) — a deploy-velocity concern, not a serving risk.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            # Keep off control-plane.
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
            # Prefer the roomy worker nodes (bumble/sting); honey is tightest
            # (12 free) so it stays spillover, not first choice.
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["bumble", "sting"]
        # Spread the (future) replicas across distinct nodes so a single node
        # loss never takes serving fully down — no node-SPOF.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: greatfallstoolbus-org
                    app.kubernetes.io/component: web
      containers:
        - name: greatfallstoolbus-org
          # Digest-pinned production image: the promoted gftb-site static
          # origin (ADR 0010 §5 cutover shape; TIN-3899 promotion). Candidate
          # 91cf300d (signed gftb-site main; operator-ratified bus photographs,
          # their goal/log mounts, the reusable optional featured-image
          # rendering, the subsequent AGENTS-only D14 contract update, and the
          # reviewed public-copy/front-matter corrections), generation 47. The
          # immutable candidate was published by GitHub Actions run 33808652168
          # on 2026-09-03; anonymous public
          # GHCR manifest resolution of the full-sha tag returned exactly the
          # digest pinned below. Previous pins (rollback candidates):
          # generation 46
          # sha256:f0e618ed5d27e6cf2ea9439d90d2f3111fa0189a29800b7feb5b95a2e7511702
          # (PINNED desired-state only; superseded before apply; NEVER RUNNING),
          # generation 45
          # sha256:498b9715ed123ac8b5e1be0c35a5355ede6880e655e77809b85bf83c8f34f24c
          # (RUNNING; retained rollback),
          # generation 44 sha256:bf3ccd175d553f5b1a73f518c27d31c852aca1c97323d00d6b22a4767b5c63bc,
          # generation 43 sha256:3096c166a25300581e89101effa078dcf4100c638b0ce357f473f485624d6862.
          # This commit records reviewed desired release truth; merge applies
          # nothing. No GFTB-local parity bridge remains. Production
          # convergence belongs to the shared GloriousFlywheel/owner-overlay
          # carrier required by decisions/0022 section 3; PINNED/RUNNING/SERVED
          # are post-apply evidence.
          image: ghcr.io/great-falls-tool-bus/gftb-site@sha256:f82534a08ba91f080fc67acec219659cb437a9874e1c3c99dedc0e6bd509fbcc
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
