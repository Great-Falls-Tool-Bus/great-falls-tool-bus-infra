# DECLARE-ONLY (dispatch-gated) — NOTHING APPLIES ON MERGE (TIN-2543, ADR 0010).
#
# GFTB on-cluster web serving workload: the promoted gftb-site static origin
# (SvelteKit adapter-static build -> Caddy on an OCI image on GHCR -> K8s
# Deployment behind a ClusterIP Service -> in-cluster cloudflared tunnel edge),
# mirroring the proven MassageIthaca full-on-cluster pattern (see
# blahaj:tofu/stacks/massageithaca/main.tf and this repo's
# docs/decisions/0001-pr-gated-ephemeral-preview-deploys.md).
#
# TREE HONESTY (rung 1, 2026-08-21; ratification basis: operator interview
# 2026-08-21, session register L71 Q2 rungs 1+2). Until this fix, this file
# named a DIFFERENT GHCR repository (ghcr.io/great-falls-tool-bus/
# greatfallstoolbus.org, the pre-split legacy adapter-node image) than the one
# production has actually served since the gftb-site promotion
# (ghcr.io/great-falls-tool-bus/gftb-site). That divergence was documented here
# and in Justfile/k8s-stack-drift.yml as PERMANENT and by-design — it is not:
# it was an artifact of the legacy carrier's declarative record never being
# updated at promotion time. The invariant going forward is: THIS FILE PINS
# WHAT IS ACTUALLY SERVED, and an operator updates the pin here as part of
# each release ceremony (see Justfile `web-release-plan` / `web-release-apply`,
# and the generation-37 pin receipt on the program board, TIN-3959). This is a
# declarative-record fix only — the `web-release-*` ceremony (Justfile) still
# renders and applies the live Deployment from operator-supplied
# WEB_APPLY_IMAGE/WEB_APPLY_SHA, attended, behind `_operator-apply-confirm`;
# nothing here changes that path, moves any authority, or causes an apply.
#
# ADR 0010 rules on-prem the production host and moves this stack from a parked
# fail-closed skeleton to the EXECUTING cutover (ADR 0010 §5 step 3: scale the
# web Deployment 0 -> 2). This manifest now carries the REAL cutover shape — a
# digest-pinned production image and replicas: 2 — so it is no longer inert. It
# stays DECLARE-ONLY in the honest sense that MERGING APPLIES NOTHING; the safety
# is the apply GATE plus the still-closed public path, not an inert manifest:
#   1. No CI applies, ever. web-crs.yml is validation-only, and TIN-3899 deleted
#      web-stack.yml, the workflow_dispatch + confirm=apply + repository_dispatch
#      apply carrier. Applying this stack is attended-operator-only now.
#   2. This stack creates NO Namespace object. greatfallstoolbus-org-production is
#      provisioned out of band; the web-apply SA is namespace-scoped and cannot
#      create it (no Namespace object here — validate-web-stack.sh enforces this).
#   3. No public traffic reaches it on merge: the honey-ingress cloudflared tunnel
#      public-hostname route and apex/www DNS stay fail-closed=false in
#      ../../tofu/intent/great-falls-tool-bus/web-oncluster-route.json (TIN-991,
#      Cloudflare dashboard / token-managed, never in git). See ../README.md.
#   4. No Secret ships here (the GHCR pull secret is operator-provisioned in the
#      namespace, never committed).
#
# The pod-template fields below (securityContext, no command/env override) match
# the exact contract Justfile's `web-release-render` asserts on the rendered
# workload byte-for-byte (see the `jq -e` contract in that recipe), so the
# checked-in base and the ceremony's render step now describe the same shape —
# the ceremony still supplies (and this file cannot fix in advance) the
# per-release image digest, source-sha annotation, and the
# default-deny-egress NetworkPolicy it synthesizes at render time (tracked as a
# residual; see the PR body / ../README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greatfallstoolbus-org
  namespace: greatfallstoolbus-org-production
  labels:
    app.kubernetes.io/name: greatfallstoolbus-org
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: great-falls-tool-bus
    app.tinyland.dev/lifecycle: declare-only
spec:
  # ADR 0010 §5 step 3: replicas 2 (MassageIthaca production shape). Nothing
  # schedules on merge — and since TIN-3899 nothing schedules from CI at all;
  # apply is attended-operator-only behind the promotion interlock.
  # Anti-affinity spreads the 2 replicas across distinct nodes (see below).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: greatfallstoolbus-org
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: greatfallstoolbus-org
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: great-falls-tool-bus
    spec:
      terminationGracePeriodSeconds: 15
      # Pod-level hardening. runAsUser/runAsGroup/fsGroup 65532 is gftb-site's
      # own image default (flake.nix `config.User = "65532:65532"`; the
      # distroless/nonroot convention) and is exactly what Justfile
      # `web-release-render` sets on every rendered release, so this is not an
      # independent choice — it is the value the ceremony has always used.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Node placement. Nothing schedules on merge (apply is dispatch-gated); at
      # cutover the 2 replicas prefer the roomy nodes and spread across hosts.
      #
      # Live-probe grounding (honey rke2, 2026-07-05, read-only kubectl): pod
      # headroom is honey 138/150 (12 free — honey was EXPANDED to 150, not the
      # ~110-cap ADR 0003 assumed), bumble 50/110 (60 free), sting 96/200
      # (104 free); ~176 free cluster-wide. A replicas:2 web Deployment fits
      # trivially, but honey is the TIGHTEST node, so at cutover we PREFER
      # bumble/sting for the serving pods and keep honey as spillover.
      #
      # Serving SPOF is NONE at the pod/node layer: 3-node cluster, node-anti-
      # affinity spreads the 2 replicas across distinct hosts, and on node loss
      # they reschedule (same posture the live cloudflared replicas:2 already
      # runs). The only genuine SPOF is SITE-LEVEL (one on-prem /24: honey
      # .70.10, bumble .11, sting .12) — the honest availability tradeoff vs a
      # global CDN, already accepted by MI in production and fronted+cached by
      # Cloudflare; the named mitigation is a warm CF-Pages standby (ADR 0007).
      # The "sting SPOF" ADR 0003 cites is CI-RUNNER concentration (all ARC/nix
      # runners on sting) — a deploy-velocity concern, not a serving risk.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            # Keep off control-plane.
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
            # Prefer the roomy worker nodes (bumble/sting); honey is tightest
            # (12 free) so it stays spillover, not first choice.
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["bumble", "sting"]
        # Spread the (future) replicas across distinct nodes so a single node
        # loss never takes serving fully down — no node-SPOF.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: greatfallstoolbus-org
                    app.kubernetes.io/component: web
      containers:
        - name: greatfallstoolbus-org
          # Digest-pinned production image: the promoted gftb-site static
          # origin (ADR 0010 §5 cutover shape; TIN-3899 promotion). Candidate
          # d22c0ca8 (gftb-site main, PR #35 merge), generation 37, pinned via
          # the attended web-release-* ceremony 2026-08-21 ~03:10 EDT
          # (TIN-3959 cache-headers release; program board receipt "GEN 37
          # CEREMONY COMPLETE"). Digest verified against the GHCR registry
          # itself: `crane digest` / manifest HEAD on tag
          # sha-d22c0ca8f4683e5d93a554872b78d0a4a81e0028 resolves to exactly
          # this sha256, matching the short-form digest recorded in the
          # ceremony receipt and the 2026-08-21 truthing
          # (devenv-gitops-truth-20260821.md). The cluster read-only proof
          # kubeconfig (~/.gftb/web-release-proofs.kubeconfig) had an expired
          # 2h SA token at the time of this fix, so this is a registry-verified
          # pin, not a fresh `kubectl get deploy` read — see the PR body.
          #
          # No command/env override: gftb-site's own image bakes
          # Entrypoint=[dumb-init --] Cmd=[caddy run --config
          # /etc/caddy/Caddyfile --adapter caddyfile] and needs no runtime env
          # (the Caddyfile hardcodes :3000 and the /health, /healthz responders
          # used by the probes below). This is not adapter-node; there is no
          # build/index.js in this image. `web-release-render` (Justfile)
          # deletes command/args/env/envFrom/volumeMounts unconditionally on
          # every render for exactly this reason.
          image: ghcr.io/great-falls-tool-bus/gftb-site@sha256:e95c9588a320a92986ccbeff630c2837b0f3be08a9100ef505225f55194746d3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
