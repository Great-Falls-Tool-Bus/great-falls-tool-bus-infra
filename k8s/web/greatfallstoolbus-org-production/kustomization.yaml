apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: greatfallstoolbus-org-production

# DISPATCH-GATED declare-only — MERGING APPLIES NOTHING (TIN-2541, ADR 0010).
# GFTB on-cluster web serving stack (SvelteKit adapter-node -> ClusterIP ->
# cloudflared tunnel), mirroring the MI full-on-cluster pattern.
# `kubectl kustomize` MUST render this cleanly (the CI/`just check` guard renders
# it). The Deployment carries the real cutover shape — replicas: 2 and a
# digest-pinned image — so the safety is that nothing applies it, not an inert
# manifest: TIN-3899 retired the web-stack.yml carrier, so the only apply left is
# an attended operator behind the promotion interlock, this stack creates no
# Namespace, and no tunnel public-hostname route exists in git (it is
# dashboard/token-managed; TIN-991). See ../README.md.

resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: great-falls-tool-bus-infra
      app.kubernetes.io/part-of: great-falls-tool-bus
      app.tinyland.dev/tenant: great-falls-tool-bus
