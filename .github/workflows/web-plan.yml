name: Web Stack Plan (rung 2)

# Rung 2 (org-standard-cd-pattern-truth-20260821.md sec 4.1; devenv-gitops-
# truth-20260821.md Q2 option B). Ratification basis: operator interview
# 2026-08-21 (session register L71 Q2 = rungs 1+2; L73 = rung 2 builds AND
# merges on the truth-doc basis, not gated on meta ADR 0020).
#
# W17 / TIN-4256: THIS WORKFLOW IS THE PR-SIDE `web-plan` STATUS CARRIER.
# It runs the credential-free render+validate pair on EVERY `pull_request`,
# unfiltered, so the `web-plan` context can be added to the branch ruleset
# (`main-reviewed-hosted-validate`, id 20930684) as a required status check
# by a separate, attended operator step (see "REQUIRED-STATUS WIRING"
# below). Two required-status mechanics force this exact trigger shape, and
# both hazards are already documented in this repo's own history (PR #127
# rounds 2-3; docs/runbooks/web-plan-required-status-activation.md):
#
# 1. A PATH-FILTERED required check freezes every PR that never dispatches
#    it -- GitHub reports the context as "Expected" forever and the PR can
#    never merge. So the `pull_request` trigger below carries NO `paths:`
#    filter (the `push` trigger keeps its filter; required-status mechanics
#    only bind on PRs).
# 2. An event-gated job (`if: github.event_name == 'push' || ...`) reports
#    `skipped` on PRs, and `skipped` SATISFIES a required status check --
#    rubber-stamp theater, not enforcement. So the job below carries no
#    such gate.
#
# PR #110 INVARIANT ("keep public PRs off private runners", `ae7cb63a`):
# this job is now the SECOND sanctioned exception -- class (3) in
# `config/organization.yaml`'s `runner_group` standing invariant --
# alongside `validate.yml`'s `validate` job (PR #116, adversarial review
# comment 5381265081), and for the same structural reason: a PR-required
# status must actually execute on every PR, which a #110-style gate
# defeats. Its compensating controls mirror `validate.yml`'s exactly:
# secret-free (`permissions: contents: read`, zero `environment:`/
# `secrets.*` references), no GloriousFlywheel checkout, no kubeconfig, no
# cluster, no registry, no Tofu state contact. The specific PR-content
# attack proven against this runner class -- `kubectl kustomize`'s
# remote-resource fetch (PR #127 comments 5377613179, 5380010266,
# 5380172269) -- is closed by the round-4 ALLOWLIST guard described below,
# which both `web-stack-render` and `scripts/validate-web-stack.sh` run
# before any `kubectl kustomize` call. The remote-only execution guard
# (#164, `scripts/remote-only-guard.sh`) passes here by construction: it
# exits 0 whenever `GITHUB_ACTIONS=true` and the runner is not
# `github-hosted`; ARC pods report `RUNNER_ENVIRONMENT=self-hosted`.
#
# THIS FILE therefore carries the PR-side required render (`pull_request`,
# unfiltered), the push-to-main honesty record (rung 2's original mandate:
# org-standard-cd-pattern-truth-20260821.md:403-404), and manual dispatch.
# All three run the SAME body: it renders the committed k8s/web declare-only
# tree (`just web-stack-render`, a plain `kubectl kustomize` behind the
# remote-resource guard below -- nothing else) and validates it against the
# same jq/yq contract the tree must already pass (`just web-stack-validate`,
# already wired into web-crs.yml), publishing both as a step summary and a
# workflow artifact. `validate.yml`'s own PR-side render step is retained
# as defense in depth; removing it is a separate operator call, not part of
# W17.
#
# HARDENED (round 4 -- a round-3 denylist version of this guard was proven
# leaky by adversarial review, comments 5380010266 + 5380172269: scheme-less
# git-host shorthand like `github.com/org/repo` bypassed its URL-prefix
# checks entirely, and the `transformers`/`configurations`/`crds` fields
# were absent from its field list, so all three fetched over the network
# unguarded). `just web-stack-render` and `scripts/validate-web-stack.sh`
# both now run `scripts/guard-no-remote-kustomize-resources.sh` before any
# `kubectl kustomize` call. It is an ALLOWLIST, not a denylist: every
# reference-carrying field kustomize's loader resolves through the same
# remote-capable path (resources/bases/components/generators/transformers/
# configurations/crds and more -- see the script header for the full list)
# is accepted ONLY if it resolves to a real, contained local path; every
# other form -- any URL scheme, any host-shorthand git reference, any `../`
# escape -- is refused. The committed tree carries only plain local
# filenames, so this is a tripwire, not a behavior change -- but it means
# even an attended operator re-running this render locally against a
# mutated tree is protected, not just this workflow.
#
# WHAT THIS DELIBERATELY DOES NOT DO, and why: it does not call
# `web-release-render` / `web-release-plan` / `web-release-candidate-proof`
# or any other member of the reviewed web-release-* candidate-promotion
# family, and `web-stack-render` calls no `just` recipe at all so it cannot
# reach that family even transitively. That family is where the real
# per-release inputs live (the GHCR candidate digest, the source-sha
# annotation, the synthesized default-deny-egress NetworkPolicy) and
# `scripts/validate-public-operator-surface.py`
# (`WEB_RELEASE_OPERATOR_LOCAL_ROOTS`, the `workflow-arc-operator-recipe` /
# `web-release-unreceipted-operator-wrapper` checks) already enforces, as a
# pre-existing and unmodified rule, that NO GitHub workflow in this
# repository -- hosted or self-hosted, this one included -- may reach it.
# That rule predates this change and exists so no CI code path is ever one
# step from `web-release-apply`; rung 2 is built to respect that boundary,
# not to get a reviewed exception carved into it. The practical honesty this
# buys: since rung 1 (deployment.yaml's "TREE HONESTY" fix) the committed
# tree already matches web-release-render's own contract for every field
# except THREE it still names as ceremony-only residuals, in order of
# consequence -- (1) the PER-RELEASE CONTAINER IMAGE DIGEST, the single field
# that decides what code production actually runs (this render shows
# whatever digest is currently committed, which is NOT necessarily what the
# next release ceremony will pin), (2) the per-release source-sha annotation,
# and (3) the synthesized default-deny-egress NetworkPolicy -- so this render
# is CLOSE to, but is not, the exact apply-time bytes. Say so plainly,
# including the digest, wherever this output is consumed; the true
# apply-time bytes are visible only via the attended `web-release-plan`'s own
# output, exactly as designed. There is also no Tofu stack for the k8s/web
# workload at all (tofu/stacks holds only arc-runners/edge/edge-dns), so
# there is no `-detailed-exitcode` tofu plan to run here either -- this
# offline kustomize render/validate pair is the complete plan surface this
# stack has.
#
# NOTHING APPLIES, NOTHING IS CONTACTED. This job touches no kubeconfig, no
# cluster, no registry, and no Tofu state backend. No environment secret is
# requested, so this workflow binds no protected `environment:` at all.
#
# REQUIRED-STATUS WIRING IS AN ATTENDED OPERATOR ACTION. Merging this file
# makes the `web-plan` context ABLE to be required (it executes and reports
# a real conclusion on every PR); it does not touch the ruleset. Sequencing
# is mandatory: first this trigger change merges to main, then `web-plan`
# is confirmed green on a real PR, and only then does the operator add
# `{"context": "web-plan", "integration_id": 15368}` to ruleset 20930684's
# `required_status_checks` -- never before, or every open PR freezes on a
# check that cannot run against its base. See
# docs/runbooks/web-plan-required-status-activation.md for the exact
# read-modify-PUT procedure.
#
# RUNNER REALITY for THIS file's job: it targets `tinyland-nix`, the same
# GF cache-fronted ARC class every other private-runner workflow in this
# repo uses. The roster exclusion an earlier revision of this header
# described is over: this repository (id 1286829099) was ADMITTED to the
# runner group in PR #128 (operator ruling 2026-08-22, TIN-3914), so runs
# are claimed promptly. `concurrency.cancel-in-progress: false` below stays
# deliberate for the same reason rung 1 flipped it on
# k8s-stack-drift.yml/edge-drift.yml (D6): a starved or busy queue shows
# honest `Queued` runs rather than cancelled-before-start churn.

on:
  # NO `paths:` filter on pull_request, deliberately (W17 / TIN-4256): a
  # path-filtered required check freezes every PR outside its filter at
  # "Expected". See the header.
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web-plan.yml"
      - "Justfile"
      - "k8s/web/**"
      - "scripts/validate-web-stack.sh"
      - "scripts/guard-no-remote-kustomize-resources.sh"
      - "tofu/intent/great-falls-tool-bus/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: web-plan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-plan:
    name: web-plan
    # NO event gate, deliberately (W17 / TIN-4256): this is the PR-required
    # `web-plan` status carrier, the second sanctioned class-(3) exception
    # to the PR #110 invariant (see the header and
    # config/organization.yaml's `runner_group` comment). A #110-style gate
    # here would make every PR report `skipped`, which SATISFIES required
    # status checks -- the exact rubber-stamp hazard this change exists to
    # avoid. Compensating controls, identical to validate.yml's `validate`
    # job: secret-free, `contents: read` only, no GloriousFlywheel checkout,
    # and the round-4 allowlist kustomize guard on every render path.
    runs-on: tinyland-nix
    timeout-minutes: 15
    steps:
      - name: Checkout overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: overlay
          persist-credentials: false

      # No GloriousFlywheel core checkout, deliberately (post-roster-admission
      # diagnosis: GloriousFlywheel is a PRIVATE repository, and the default
      # GITHUB_TOKEN scoped to THIS repo has no cross-repo read access to it --
      # every self-hosted workflow that checks it out unauthenticated, or
      # curls its raw content unauthenticated, now fails with "Repository not
      # found" the moment it actually gets a runner, which the roster
      # exclusion had masked until tonight's admission (run 32578669722,
      # web-crs.yml run 32573658211, flywheel-cache-proof.yml run 32578597531
      # all fail the identical way). Rather than add a credential to work
      # around that, this recipe never needed the core checkout in the first
      # place: `web-stack-validate`/`web-stack-render` are plain
      # kustomize+yq+jq+kubectl, and this repo's OWN `flake.nix` devshell
      # already provides all of them directly (verified: `validate.yml`'s
      # hosted PR-side render step already runs `nix develop .` -c just
      # web-stack-render` with zero GloriousFlywheel involvement and passes).
      # The `./GloriousFlywheel/.github/actions/nix-job` composite action
      # this step used to route through exists to bootstrap Nix on a runner
      # that might not have it and to wire the Attic build cache; neither is
      # needed here -- `tinyland-nix` self-hosted runners ship Determinate
      # Nix already, and this render/validate pair is too small for the cache
      # to matter. This is strictly simpler and has one less moving part
      # (and one less private-repo dependency) than every other self-hosted
      # workflow in this repo, not a regression relative to them.
      - name: Render and validate the committed web stack (offline; no cluster, no credential)
        run: |
          set -euo pipefail
          for nixbin in /nix/var/nix/profiles/default/bin "${HOME}/.nix-profile/bin"; do
            if [ -d "${nixbin}" ]; then
              export PATH="${nixbin}:${PATH}"
            fi
          done
          if ! command -v nix >/dev/null 2>&1; then
            echo "::error::nix is required on the tinyland-nix runner (expected preinstalled Determinate Nix)."
            exit 1
          fi
          cd overlay
          nix develop . -c just web-stack-validate
          nix develop . -c just web-stack-render > web-plan-rendered.yaml
          image="$(nix develop . -c yq -r 'select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "greatfallstoolbus-org") | .image' web-plan-rendered.yaml)"
          {
            echo "## GFTB web stack plan (rung 2 -- committed-tree render, no cluster, no credential)"
            echo ""
            echo "This is the COMMITTED declare-only tree, not the reviewed"
            echo "candidate-promotion ceremony's output. The ceremony still"
            echo "supplies three things this render cannot, in order of"
            echo "consequence:"
            echo ""
            echo "1. **The per-release container image digest** -- the field"
            echo "   that decides what code production actually runs. This"
            echo "   render shows the digest currently committed to main"
            echo "   (below); it is NOT necessarily what the next release"
            echo "   ceremony will pin."
            echo "2. The per-release \`app.tinyland.dev/source-sha\` annotation."
            echo "3. The synthesized \`default-deny-egress\` NetworkPolicy."
            echo ""
            echo "**Committed image digest:** \`${image}\`"
            echo ""
            echo "See the workflow header for the full explanation."
            echo ""
            echo '```yaml'
            cat web-plan-rendered.yaml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gftb-web-stack-plan
          path: overlay/web-plan-rendered.yaml
          if-no-files-found: ignore
          retention-days: 7
