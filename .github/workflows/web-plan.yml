name: Web Stack Plan (rung 2)

# Rung 2 (org-standard-cd-pattern-truth-20260821.md sec 4.1; devenv-gitops-
# truth-20260821.md Q2 option B). Ratification basis: operator interview
# 2026-08-21 (session register L71 Q2 = rungs 1+2; L73 = rung 2 builds AND
# merges on the truth-doc basis, not gated on meta ADR 0020).
#
# WHAT THIS DOES: on every push to main AND every pull request (regardless of
# which paths it touches -- see "CHECK SEMANTICS" below), render the
# committed k8s/web declare-only tree (`just web-stack-render`, a plain
# `kubectl kustomize`, nothing else) and validate it against the same
# jq/yq contract the tree must already pass (`just web-stack-validate`,
# already wired into web-crs.yml) -- but ONLY when the change actually
# touches a web-stack path; otherwise the job no-ops green with an explicit
# step summary saying so. Both outputs are published as a step summary and a
# workflow artifact when the render runs, so every relevant push/PR gets a
# computed, reviewable answer to "what does the tree currently declare".
#
# CHECK SEMANTICS (fixed after adversarial review, comment 5377515480,
# EDIT-1): the FIRST version of this workflow path-filtered the `pull_request`
# trigger itself, and job-gated execution to `push`/`workflow_dispatch` only.
# That is broken as a required-status design in two independent ways: (a) a
# PR touching none of the five paths never dispatches this workflow AT ALL,
# so a required `web-plan` check sits at "Expected -- waiting for status to
# be reported" forever, not "green" -- measured against this repo's own
# history, 13 of the last 30 commits on main would have been permanently
# unmergeable under that design; (b) on a PR that DOES match the path filter,
# the job-level `if:` skipped the job body, and GitHub counts a `skipped`
# conclusion as SATISFYING a required status check -- so the design as first
# written would have blocked ~43% of PRs and rubber-stamped the rest. Fixed
# here: the workflow triggers on every `pull_request` and every `push` to
# main, unfiltered, and the job ALWAYS runs and ALWAYS reports a real `web-plan`
# conclusion; path relevance is detected INSIDE the job (the "Detect changed
# web-stack paths" step) and only gates whether the render/validate step
# actually executes -- an irrelevant change gets an explicit, real "no
# web-stack paths touched" green, not a `skipped` conclusion and not a
# silently-never-reported one.
#
# SECURITY POSTURE, STATED PLAINLY: this is the first workflow in this
# repository whose job body can execute on an arbitrary `pull_request` event
# (every other self-hosted `tinyland-nix` workflow here -- archive-stack,
# form-crs, list-crs, mail-crs, web-crs, the drift lanes -- stays job-gated to
# trusted push/workflow_dispatch events only, specifically because THEY carry
# a protected-environment kubeconfig secret an untrusted PR must never reach).
# That precedent does not apply the same way here because THIS workflow binds
# no `environment:`, requests no secret, and touches no kubeconfig or cluster
# -- there is nothing present for a malicious PR to steal. The residual risk
# is narrower but real: a PR that edits `Justfile`, `scripts/validate-web-stack.sh`,
# or the `k8s/web/**` tree gets that exact edited content executed by
# `nix develop`/`just`/`bash` on the `tinyland-nix` runner (for same-repo PRs,
# the workflow FILE itself is also PR-controlled; for fork PRs, GitHub always
# runs the BASE branch's workflow definition, so `GF_CORE_REF` and the
# checkout `repository:`/`ref:` inputs stay trusted even then, but the
# checked-out `overlay` tree's Justfile/script content is still the PR's own).
# Worst case is arbitrary command execution on a credential-free, cluster-
# read-free runner -- not a credential leak or a cluster mutation -- but it is
# a real, deliberate widening of this repo's usual self-hosted+PR boundary,
# flagged here for visibility rather than left implicit.
#
# WHAT THIS DELIBERATELY DOES NOT DO, and why: it does not call
# `web-release-render` / `web-release-plan` / `web-release-candidate-proof`
# or any other member of the reviewed web-release-* candidate-promotion
# family, and `web-stack-render` calls no `just` recipe at all so it cannot
# reach that family even transitively. That family is where the real
# per-release inputs live (the GHCR candidate digest, the source-sha
# annotation, the synthesized default-deny-egress NetworkPolicy) and
# `scripts/validate-public-operator-surface.py`
# (`WEB_RELEASE_OPERATOR_LOCAL_ROOTS`, the `workflow-arc-operator-recipe` /
# `web-release-unreceipted-operator-wrapper` checks) already enforces, as a
# pre-existing and unmodified rule, that NO GitHub workflow in this
# repository -- hosted or self-hosted, this one included -- may reach it.
# That rule predates this change and exists so no CI code path is ever one
# step from `web-release-apply`; rung 2 is built to respect that boundary,
# not to get a reviewed exception carved into it. The practical honesty this
# buys: since rung 1 (deployment.yaml's "TREE HONESTY" fix) the committed
# tree already matches web-release-render's own contract for every field
# except THREE it still names as ceremony-only residuals, in order of
# consequence -- (1) the PER-RELEASE CONTAINER IMAGE DIGEST, the single field
# that decides what code production actually runs (this render shows
# whatever digest is currently committed, which is NOT necessarily what the
# next release ceremony will pin), (2) the per-release source-sha annotation,
# and (3) the synthesized default-deny-egress NetworkPolicy -- so this render
# is CLOSE to, but is not, the exact apply-time bytes. Say so plainly,
# including the digest, wherever this output is consumed; the true
# apply-time bytes are visible only via the attended `web-release-plan`'s own
# output, exactly as designed. There is also no Tofu stack for the k8s/web
# workload at all (tofu/stacks holds only arc-runners/edge/edge-dns), so
# there is no `-detailed-exitcode` tofu plan to run here either -- this
# offline kustomize render/validate pair is the complete plan surface this
# stack has.
#
# NOTHING APPLIES, NOTHING IS CONTACTED. This job touches no kubeconfig, no
# cluster, no registry, and no Tofu state backend. No environment secret is
# requested, so this workflow binds no protected `environment:` at all --
# strictly less than every other private-runner workflow in this repo needs.
#
# ENFORCEMENT IS DECLARE-ONLY. This workflow is REAL -- it renders and
# validates on every relevant push/PR -- but it is NOT wired into the branch
# ruleset as a required status check by this change. See
# docs/runbooks/web-plan-required-status-activation.md for why and for the
# exact operator step that flips it on later.
#
# RUNNER REALITY (read before assuming green means it ran): this job targets
# `tinyland-nix`, the same GF cache-fronted ARC class every other private-
# runner workflow in this repo uses -- never a GitHub-hosted `ubuntu-*`
# runner. TIN-3902's roster (config/organization.yaml
# `runner_contract.runner_group.selected_repository_ids`) currently EXCLUDES
# this repository (id 1286829099) from that runner group, and DRAFT PR #116
# (the chain that would admit it) is HELD pending the operator's admission
# ruling. Until that ruling lands, a run of this workflow has no runner to
# claim it and the Checks tab will show `web-plan` sitting `Queued` --
# GitHub's own honestly-labeled state for "no eligible runner", not a hidden
# failure or a silent no-op. This is exactly why enforcement stays
# declare-only: a `Queued`-forever job as a REQUIRED check would freeze every
# merge to main. This is a SEPARATE hazard from the check-semantics fix
# above: that fix makes sure a real runner produces a real, meaningful
# conclusion; it does nothing about there being no runner at all yet.
# `concurrency.cancel-in-progress: false` below is deliberate for the same
# reason rung 1 flipped it on k8s-stack-drift.yml/edge-drift.yml (D6): with
# `cancel-in-progress: true`, a starved queue produces a string of runs
# cancelled-before-they-ever-started on every subsequent push, which reads as
# ambiguous churn rather than the honest "queued, waiting on the roster
# admission" state. `timeout-minutes` below bounds the OTHER failure mode --
# a run that IS claimed by a runner but then hangs -- so that case fails loud
# with a clear timeout instead of holding the runner indefinitely. GitHub
# Actions has no native short timeout for a job that is never claimed at all
# (self-hosted queued jobs are only auto-cancelled at the platform's ~24h
# ceiling); building a real watchdog for that specific case would require a
# second job on a different runner class, and every such class available to
# this org is either `tinyland-nix` itself (same failure mode) or a
# GitHub-hosted `ubuntu-*` runner, which house policy (TIN-3914) forbids
# outright. Stated here plainly rather than papered over with a mechanism
# that doesn't actually exist.

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: web-plan-${{ github.ref }}
  cancel-in-progress: false

env:
  GF_CORE_REF: 2281b576bce0e8dd776a047b84e7464f5b508a62

jobs:
  web-plan:
    name: web-plan
    runs-on: tinyland-nix
    timeout-minutes: 15
    steps:
      - name: Checkout overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: overlay
          persist-credentials: false
          fetch-depth: 0

      # Reads file names only via `git diff --name-only`; executes no
      # repo-controlled content. Safe to run unconditionally, including on
      # untrusted pull_request events, before anything from the tree runs.
      - name: Detect changed web-stack paths
        id: changed
        working-directory: overlay
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "::notice::workflow_dispatch: rendering unconditionally (operator-requested)."
            exit 0
          fi
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
            head="${PUSH_AFTER_SHA}"
          fi
          zero="0000000000000000000000000000000000000000"
          if [ -z "${base}" ] || [ "${base}" = "${zero}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::notice::No usable base commit for change detection (base='${base:-<empty>}'); rendering unconditionally -- fail open to RENDER, never to silently skip."
            echo "render=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${base}" "${head}" --)"
          echo "::group::Changed paths (${base}..${head})"
          printf '%s\n' "${changed}"
          echo "::endgroup::"
          matched="false"
          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            case "${path}" in
              .github/workflows/web-plan.yml|Justfile|k8s/web/*|scripts/validate-web-stack.sh|tofu/intent/great-falls-tool-bus/*)
                matched="true"
                ;;
            esac
          done <<< "${changed}"
          echo "render=${matched}" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned GloriousFlywheel core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: ${{ env.GF_CORE_REF }}
          path: GloriousFlywheel
          persist-credentials: false

      - name: Verify GloriousFlywheel core checkout
        run: |
          set -euo pipefail
          actual="$(git -C GloriousFlywheel rev-parse --verify HEAD)"
          if [ "${actual}" != "${GF_CORE_REF}" ]; then
            echo "::error::GloriousFlywheel checkout mismatch: expected ${GF_CORE_REF}, got ${actual}"
            exit 1
          fi

      - name: Render and validate the committed web stack (offline; no cluster, no credential)
        if: steps.changed.outputs.render == 'true'
        uses: ./GloriousFlywheel/.github/actions/nix-job
        with:
          push-cache: "false"
          command: |
            set -euo pipefail
            cd overlay
            export GF_CORE_PATH=../GloriousFlywheel
            export GF_CORE_CI_PATH="github:tinyland-inc/GloriousFlywheel/${GF_CORE_REF}#ci"
            nix develop "${GF_CORE_CI_PATH}" -c just web-stack-validate
            nix develop "${GF_CORE_CI_PATH}" -c just web-stack-render > web-plan-rendered.yaml
            image="$(nix develop "${GF_CORE_CI_PATH}" -c yq -r 'select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "greatfallstoolbus-org") | .image' web-plan-rendered.yaml)"
            {
              echo "## GFTB web stack plan (rung 2 -- committed-tree render, no cluster, no credential)"
              echo ""
              echo "This is the COMMITTED declare-only tree, not the reviewed"
              echo "candidate-promotion ceremony's output. The ceremony still"
              echo "supplies three things this render cannot, in order of"
              echo "consequence:"
              echo ""
              echo "1. **The per-release container image digest** -- the field"
              echo "   that decides what code production actually runs. This"
              echo "   render shows the digest currently committed to main"
              echo "   (below); it is NOT necessarily what the next release"
              echo "   ceremony will pin."
              echo "2. The per-release \`app.tinyland.dev/source-sha\` annotation."
              echo "3. The synthesized \`default-deny-egress\` NetworkPolicy."
              echo ""
              echo "**Committed image digest:** \`${image}\`"
              echo ""
              echo "See the workflow header for the full explanation."
              echo ""
              echo '```yaml'
              cat web-plan-rendered.yaml
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

      - name: No web-stack paths touched (no-op, reports green)
        if: steps.changed.outputs.render != 'true'
        run: |
          {
            echo "## GFTB web stack plan (rung 2)"
            echo ""
            echo "No web-stack paths touched by this change -- render skipped,"
            echo "reporting green. This is a real, reported conclusion, not a"
            echo "\`skipped\` check run: web-plan always executes and always"
            echo "reports."
            echo ""
            echo "Paths that would trigger a render: \`.github/workflows/web-plan.yml\`,"
            echo "\`Justfile\`, \`k8s/web/**\`, \`scripts/validate-web-stack.sh\`,"
            echo "\`tofu/intent/great-falls-tool-bus/**\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        if: always() && steps.changed.outputs.render == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gftb-web-stack-plan
          path: overlay/web-plan-rendered.yaml
          if-no-files-found: ignore
          retention-days: 7
