name: Web Stack Plan (rung 2)

# Rung 2 (org-standard-cd-pattern-truth-20260821.md sec 4.1; devenv-gitops-
# truth-20260821.md Q2 option B). Ratification basis: operator interview
# 2026-08-21 (session register L71 Q2 = rungs 1+2; L73 = rung 2 builds AND
# merges on the truth-doc basis, not gated on meta ADR 0020).
#
# TWO STANDING RULES THIS WORKFLOW MUST SATISFY SIMULTANEOUSLY, AND HOW
# (round 3, after adversarial review PR #127 comment 5377613179 -- read this
# section before touching triggers or the job-level `if:` below):
#
# 1. "Keep public PRs off private runners" -- PR #110 (`ae7cb63a`), which
#    introduced `if: github.event_name == 'push' || github.event_name ==
#    'workflow_dispatch'` into every self-hosted `tinyland-nix` workflow in
#    this repository, and which `config/organization.yaml:94-96` cites as
#    PART OF WHY this repository stays off the ARC runner-group roster ("its
#    apply/drift workflows are gated to push/workflow_dispatch/
#    repository_dispatch"). A round-2 version of this workflow removed that
#    gate specifically for `web-plan.yml` to fix a required-status defect
#    (see below), making it the ONLY tinyland-nix workflow without it.
#    Adversarial review proved that exposure real, not theoretical: `kubectl
#    kustomize` fetches remote `resources`/`bases`/`components`/`generators`
#    entries over the network with NO flag required (a one-line addition to
#    a scratch copy of this stack's kustomization produced a real outbound
#    connection attempt), `scripts/validate-web-stack.sh` ran the same
#    unguarded `kubectl kustomize` call, and both the Justfile and that
#    script are themselves PR-controlled content sitting in this workflow's
#    own trigger-path list -- on a PUBLIC repository with `allow_forking` and
#    a `first_time_contributors`-only approval policy (returning contributors
#    run unapproved), on the SAME runner class that carries real kubeconfigs
#    and Cloudflare tokens for other stacks and sits on the same substrate as
#    the Tofu state backend (`config/organization.yaml`'s
#    `tofu-state-rustfs.nix-cache.svc:9000`). Restored here: the `#110` gate
#    is back, `web-plan.yml` is push-to-main/workflow_dispatch-only again,
#    identical in posture to the other seven self-hosted workflows (same
#    `permissions: contents: read`, same zero `environment:`/`secrets.`
#    refs as `web-crs.yml`, which stayed gated throughout and is the exact
#    control that refutes any "credential-free job, different rules"
#    argument -- the runner CLASS is shared; the job's own credential
#    posture does not change that).
#
# 2. "Every push to main renders the plan as a required status" (rung 2's
#    actual mandate; org-standard-cd-pattern-truth-20260821.md:403-404) --
#    which needs SOME check to report on every PR, not just on push to main,
#    or a required check freezes every PR that never dispatches it. Solved
#    WITHOUT creating a new hosted (`ubuntu-*`) dependency and WITHOUT
#    reopening rule 1: the PR-side render lives in `.github/workflows/
#    validate.yml`'s existing hosted `validate` job instead -- that job
#    already runs on every `pull_request`, unfiltered, is already this
#    repo's declared "PR validation authority" (PR #110's own commit
#    message), is already secret-free for this purpose, and is already
#    slated to migrate wholesale onto the GF cache-fronted runner class by
#    DRAFT PR #120 ("ci: migrate off GitHub-hosted runners", TIN-3914 Phase
#    B) -- so the render migrates with it for free the day #120 lands,
#    creating ZERO new hosted surface area. See `validate.yml` for that
#    step; it shares this file's `web-stack-render` recipe and residual list.
#
# THIS FILE, going forward, IS ONLY the push-to-main / manual-dispatch half:
# it renders the committed k8s/web declare-only tree (`just web-stack-render`,
# a plain `kubectl kustomize` behind the remote-resource guard below --
# nothing else) and validates it against the same jq/yq contract the tree
# must already pass (`just web-stack-validate`, already wired into
# web-crs.yml), publishing both as a step summary and a workflow artifact on
# every trusted push to main. It registers on `pull_request` (path-filtered,
# exactly like `web-crs.yml`) purely for Checks-tab visibility; the job body
# never executes for that event, and it is NEVER the PR-required-status
# carrier -- that is `validate.yml`, which is not path-filtered and cannot
# freeze on an unrelated PR the way a path-filtered required check can.
#
# HARDENED (round 4 -- a round-3 denylist version of this guard was proven
# leaky by adversarial review, comments 5380010266 + 5380172269: scheme-less
# git-host shorthand like `github.com/org/repo` bypassed its URL-prefix
# checks entirely, and the `transformers`/`configurations`/`crds` fields
# were absent from its field list, so all three fetched over the network
# unguarded). `just web-stack-render` and `scripts/validate-web-stack.sh`
# both now run `scripts/guard-no-remote-kustomize-resources.sh` before any
# `kubectl kustomize` call. It is an ALLOWLIST, not a denylist: every
# reference-carrying field kustomize's loader resolves through the same
# remote-capable path (resources/bases/components/generators/transformers/
# configurations/crds and more -- see the script header for the full list)
# is accepted ONLY if it resolves to a real, contained local path; every
# other form -- any URL scheme, any host-shorthand git reference, any `../`
# escape -- is refused. The committed tree carries only plain local
# filenames, so this is a tripwire, not a behavior change -- but it means
# even an attended operator re-running this render locally against a
# mutated tree is protected, not just this workflow.
#
# WHAT THIS DELIBERATELY DOES NOT DO, and why: it does not call
# `web-release-render` / `web-release-plan` / `web-release-candidate-proof`
# or any other member of the reviewed web-release-* candidate-promotion
# family, and `web-stack-render` calls no `just` recipe at all so it cannot
# reach that family even transitively. That family is where the real
# per-release inputs live (the GHCR candidate digest, the source-sha
# annotation, the synthesized default-deny-egress NetworkPolicy) and
# `scripts/validate-public-operator-surface.py`
# (`WEB_RELEASE_OPERATOR_LOCAL_ROOTS`, the `workflow-arc-operator-recipe` /
# `web-release-unreceipted-operator-wrapper` checks) already enforces, as a
# pre-existing and unmodified rule, that NO GitHub workflow in this
# repository -- hosted or self-hosted, this one included -- may reach it.
# That rule predates this change and exists so no CI code path is ever one
# step from `web-release-apply`; rung 2 is built to respect that boundary,
# not to get a reviewed exception carved into it. The practical honesty this
# buys: since rung 1 (deployment.yaml's "TREE HONESTY" fix) the committed
# tree already matches web-release-render's own contract for every field
# except THREE it still names as ceremony-only residuals, in order of
# consequence -- (1) the PER-RELEASE CONTAINER IMAGE DIGEST, the single field
# that decides what code production actually runs (this render shows
# whatever digest is currently committed, which is NOT necessarily what the
# next release ceremony will pin), (2) the per-release source-sha annotation,
# and (3) the synthesized default-deny-egress NetworkPolicy -- so this render
# is CLOSE to, but is not, the exact apply-time bytes. Say so plainly,
# including the digest, wherever this output is consumed; the true
# apply-time bytes are visible only via the attended `web-release-plan`'s own
# output, exactly as designed. There is also no Tofu stack for the k8s/web
# workload at all (tofu/stacks holds only arc-runners/edge/edge-dns), so
# there is no `-detailed-exitcode` tofu plan to run here either -- this
# offline kustomize render/validate pair is the complete plan surface this
# stack has.
#
# NOTHING APPLIES, NOTHING IS CONTACTED. This job touches no kubeconfig, no
# cluster, no registry, and no Tofu state backend. No environment secret is
# requested, so this workflow binds no protected `environment:` at all.
#
# ENFORCEMENT IS DECLARE-ONLY. Neither this workflow NOR the validate.yml
# render step is wired into the branch ruleset as a required status by this
# change. See docs/runbooks/web-plan-required-status-activation.md.
#
# RUNNER REALITY for THIS file's job (read before assuming green means it
# ran): it targets `tinyland-nix`, the same GF cache-fronted ARC class every
# other private-runner workflow in this repo uses. TIN-3902's roster
# (config/organization.yaml `runner_contract.runner_group.selected_repository_ids`)
# currently EXCLUDES this repository (id 1286829099) from that runner group,
# and DRAFT PR #116 (the chain that would admit it) is HELD pending the
# operator's admission ruling. Until that ruling lands, a run of this
# workflow has no runner to claim it and the Checks tab will show `web-plan`
# sitting `Queued` -- GitHub's own honestly-labeled state for "no eligible
# runner", not a hidden failure or a silent no-op. This does not affect PR
# coverage at all now: the PR-side check lives in `validate.yml`, on
# `ubuntu-24.04`, which cannot be starved by this roster gap.
# `concurrency.cancel-in-progress: false` below is deliberate for the same
# reason rung 1 flipped it on k8s-stack-drift.yml/edge-drift.yml (D6): with
# `cancel-in-progress: true`, a starved queue produces a string of runs
# cancelled-before-they-ever-started on every subsequent push, which reads as
# ambiguous churn rather than the honest "queued, waiting on the roster
# admission" state.

on:
  pull_request:
    paths:
      - ".github/workflows/web-plan.yml"
      - "Justfile"
      - "k8s/web/**"
      - "scripts/validate-web-stack.sh"
      - "scripts/guard-no-remote-kustomize-resources.sh"
      - "tofu/intent/great-falls-tool-bus/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web-plan.yml"
      - "Justfile"
      - "k8s/web/**"
      - "scripts/validate-web-stack.sh"
      - "scripts/guard-no-remote-kustomize-resources.sh"
      - "tofu/intent/great-falls-tool-bus/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: web-plan-${{ github.ref }}
  cancel-in-progress: false

env:
  GF_CORE_REF: 2281b576bce0e8dd776a047b84e7464f5b508a62

jobs:
  web-plan:
    name: web-plan
    # PR #110 invariant, restored (round 3): self-hosted ARC runner + PR
    # content never mix in this repository. `web-crs.yml`'s identical `validate`
    # job (same runner, same permissions, same zero secrets) is the control
    # this posture is checked against. A PR run shows this check as skipped,
    # not hidden -- and, unlike round 2, it is also NOT this repo's PR-side
    # web-stack signal any more; that is validate.yml now.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: tinyland-nix
    timeout-minutes: 15
    steps:
      - name: Checkout overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: overlay
          persist-credentials: false

      - name: Checkout pinned GloriousFlywheel core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: ${{ env.GF_CORE_REF }}
          path: GloriousFlywheel
          persist-credentials: false

      - name: Verify GloriousFlywheel core checkout
        run: |
          set -euo pipefail
          actual="$(git -C GloriousFlywheel rev-parse --verify HEAD)"
          if [ "${actual}" != "${GF_CORE_REF}" ]; then
            echo "::error::GloriousFlywheel checkout mismatch: expected ${GF_CORE_REF}, got ${actual}"
            exit 1
          fi

      - name: Render and validate the committed web stack (offline; no cluster, no credential)
        uses: ./GloriousFlywheel/.github/actions/nix-job
        with:
          push-cache: "false"
          command: |
            set -euo pipefail
            cd overlay
            export GF_CORE_PATH=../GloriousFlywheel
            export GF_CORE_CI_PATH="github:tinyland-inc/GloriousFlywheel/${GF_CORE_REF}#ci"
            nix develop "${GF_CORE_CI_PATH}" -c just web-stack-validate
            nix develop "${GF_CORE_CI_PATH}" -c just web-stack-render > web-plan-rendered.yaml
            image="$(nix develop "${GF_CORE_CI_PATH}" -c yq -r 'select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "greatfallstoolbus-org") | .image' web-plan-rendered.yaml)"
            {
              echo "## GFTB web stack plan (rung 2 -- committed-tree render, no cluster, no credential)"
              echo ""
              echo "This is the COMMITTED declare-only tree, not the reviewed"
              echo "candidate-promotion ceremony's output. The ceremony still"
              echo "supplies three things this render cannot, in order of"
              echo "consequence:"
              echo ""
              echo "1. **The per-release container image digest** -- the field"
              echo "   that decides what code production actually runs. This"
              echo "   render shows the digest currently committed to main"
              echo "   (below); it is NOT necessarily what the next release"
              echo "   ceremony will pin."
              echo "2. The per-release \`app.tinyland.dev/source-sha\` annotation."
              echo "3. The synthesized \`default-deny-egress\` NetworkPolicy."
              echo ""
              echo "**Committed image digest:** \`${image}\`"
              echo ""
              echo "See the workflow header for the full explanation."
              echo ""
              echo '```yaml'
              cat web-plan-rendered.yaml
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gftb-web-stack-plan
          path: overlay/web-plan-rendered.yaml
          if-no-files-found: ignore
          retention-days: 7
