name: Validate Overlay

# This public repository's validation is deliberately secret-free and runs on
# a GitHub-hosted runner. The selected `tinyland-nix` group remains restricted
# to admitted private repositories; validation must not weaken that boundary.
#
# ALSO CARRIES: the rung-2 web-stack plan render for pull requests (round 3,
# after adversarial review PR #127 comment 5377613179). `.github/workflows/
# web-plan.yml` is push-to-main/workflow_dispatch-only (PR #110's "keep
# public PRs off private runners" invariant, restored there after round 2
# briefly and wrongly removed it for this one workflow). Something still has
# to report a real, always-executing conclusion on every PR so a future
# required `web-plan`-equivalent check can never freeze on an unrelated PR --
# this job is that something: it already runs on every `pull_request`
# unfiltered, is already this repository's declared PR validation authority
# (PR #110's own commit message), is already secret-free for this purpose,
# and is already slated to migrate wholesale onto the GF cache-fronted
# runner class by DRAFT PR #120 ("ci: migrate off GitHub-hosted runners",
# TIN-3914 Phase B) -- so the render migrates with it for free the day #120
# lands, and this change creates ZERO new hosted dependence. The render step
# below shares `web-plan.yml`'s `web-stack-render` recipe and residual-list
# wording; see that file's header for the full rung-2 explanation and for
# why the render never reaches the reviewed web-release-* candidate-
# promotion family. `kubectl`/`yq`/`jq` are already available in this job's
# `nix develop .` devshell -- `just check-hosted` below already exercises
# `web-stack-validate` (and therefore the same tools) today, so the new step
# adds no new dependency.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: overlay
          persist-credentials: false
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Validate overlay contract
        env:
          GH_ACTION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for nixbin in /nix/var/nix/profiles/default/bin "${HOME}/.nix-profile/bin"; do
            if [ -d "${nixbin}" ]; then
              export PATH="${nixbin}:${PATH}"
            fi
          done

          if ! command -v nix >/dev/null 2>&1; then
            echo "::error::nix is required on the validation runner."
            exit 1
          fi

          if ! nix store ping >/dev/null 2>&1; then
            echo "::error::Nix daemon is unavailable after the pinned installer."
            exit 1
          fi

          append_nix_config_line() {
            local key="$1"
            local value="$2"
            if printf '%s\n' "${NIX_CONFIG:-}" | grep -Eq "^[[:space:]]*${key}[[:space:]]*="; then
              return 0
            fi
            if [ -n "${NIX_CONFIG:-}" ]; then
              export NIX_CONFIG="$(printf '%s\n%s = %s' "${NIX_CONFIG}" "${key}" "${value}")"
            else
              export NIX_CONFIG="${key} = ${value}"
            fi
          }

          append_nix_config_line "experimental-features" "nix-command flakes"
          append_nix_config_line "accept-flake-config" "true"
          append_nix_config_line "access-tokens" "github.com=${GH_ACTION_TOKEN}"
          cd overlay
          nix develop . -c just check-hosted

      # Cosmetic only: never gates whether the render step below executes --
      # it always executes and always reports. This just varies the summary
      # wording between "this change touches the web stack" and "informational
      # only, unrelated to this change" so a reviewer isn't told a render is
      # about their diff when it isn't.
      - name: Detect web-stack path relevance (wording only, never skips the render)
        id: web_stack_touch
        working-directory: overlay
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          touched="unknown"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            base="${PUSH_BEFORE_SHA}"
            head="${PUSH_AFTER_SHA}"
          else
            base=""
            head=""
          fi
          zero="0000000000000000000000000000000000000000"
          if [ -n "${base}" ] && [ "${base}" != "${zero}" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "${base}" "${head}" --)"
            touched="false"
            while IFS= read -r path; do
              [ -n "${path}" ] || continue
              case "${path}" in
                .github/workflows/web-plan.yml|.github/workflows/validate.yml|Justfile|k8s/web/*|scripts/validate-web-stack.sh|scripts/guard-no-remote-kustomize-resources.sh|tofu/intent/great-falls-tool-bus/*)
                  touched="true"
                  ;;
              esac
            done <<< "${changed}"
          fi
          echo "touched=${touched}" >> "$GITHUB_OUTPUT"

      # Always executes, always reports a real conclusion -- never a `skipped`
      # step. Offline, no cluster, no registry, no credential: the same
      # web-stack-render recipe web-plan.yml uses, behind the same
      # remote-resource guard.
      - name: Render web stack plan (rung 2, PR-side; offline, no cluster, no credential)
        env:
          TOUCHED: ${{ steps.web_stack_touch.outputs.touched }}
        run: |
          set -euo pipefail
          for nixbin in /nix/var/nix/profiles/default/bin "${HOME}/.nix-profile/bin"; do
            if [ -d "${nixbin}" ]; then
              export PATH="${nixbin}:${PATH}"
            fi
          done
          cd overlay
          nix develop . -c just web-stack-render > web-plan-rendered.yaml
          image="$(nix develop . -c yq -r 'select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "greatfallstoolbus-org") | .image' web-plan-rendered.yaml)"
          {
            echo "## GFTB web stack plan (rung 2, PR-side render -- no cluster, no credential)"
            echo ""
            if [ "${TOUCHED}" = "true" ]; then
              echo "This PR touches a web-stack path -- the render below reflects the tree at this PR's head."
            elif [ "${TOUCHED}" = "false" ]; then
              echo "This PR does not touch a web-stack path -- the render below is informational only, unrelated to this change."
            else
              echo "Could not determine whether this change touches a web-stack path -- rendering unconditionally (fail open to render, never to silently skip)."
            fi
            echo ""
            echo "This is the COMMITTED declare-only tree, not the reviewed"
            echo "candidate-promotion ceremony's output. The ceremony still"
            echo "supplies three things this render cannot, in order of"
            echo "consequence:"
            echo ""
            echo "1. **The per-release container image digest** -- the field"
            echo "   that decides what code production actually runs. This"
            echo "   render shows the digest currently committed to main"
            echo "   (below); it is NOT necessarily what the next release"
            echo "   ceremony will pin."
            echo "2. The per-release \`app.tinyland.dev/source-sha\` annotation."
            echo "3. The synthesized \`default-deny-egress\` NetworkPolicy."
            echo ""
            echo "**Committed image digest:** \`${image}\`"
            echo ""
            echo "See \`.github/workflows/web-plan.yml\`'s header for the full explanation."
            echo ""
            echo '```yaml'
            cat web-plan-rendered.yaml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
