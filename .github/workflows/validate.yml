name: Validate Overlay

# This public repository's validation is deliberately secret-free. TIN-3914:
# it runs on the GF cache-fronted `tinyland-nix` ARC fleet, not a
# GitHub-hosted runner -- GitHub-hosted runners are not an option in this
# estate (operator ruling 2026-08-19, TIN-3914: "never ubuntu-* runners; only
# GF cache-fronted ARC runners"). ADMISSION HOLD RESOLVED: this repository
# (id 1286829099) joined the `great-falls-tool-bus-infra` runner group's
# roster in PR #128 (`config/organization.yaml`, operator ruling 2026-08-22).
# Before that merge this job had no runner and `validate` -- the sole
# required status check on `main` -- was permanently pending; this PR is the
# other half of closing that (the roster admission alone does not move this
# job off `ubuntu-24.04`).
#
# OPEN QUESTION FOR THIS PR'S REVIEW, not something this header settles:
# `config/organization.yaml`'s `runner_group` comment states a standing
# invariant -- no `pull_request`-triggered job reaches `tinyland-nix` --
# enforced by every OTHER self-hosted workflow in this repository via either
# a trusted-event `if:` gate (PR #110, `ae7cb63a`,
# `github.event_name == 'push' || github.event_name == 'workflow_dispatch'`)
# or by declaring no `pull_request` trigger at all. This job cannot adopt
# either: it runs UNFILTERED on every `pull_request` by design, because it
# is both this repository's sole required status check and (see "ALSO
# CARRIES" below) the always-executing, always-reporting home for the
# rung-2 web-stack PR-side render -- both require running on every PR. Its
# compensating control is staying secret-free (`permissions: contents:
# read`, zero `environment:`/`secrets.*` references, matching every other
# `tinyland-nix` job here) rather than event-gated. "Secret-free" and
# "gated" are different properties, and whether secret-freedom alone is
# sufficient compensation for a `pull_request`-unfiltered job on this runner
# class -- making this job a deliberate, single exception to the invariant
# rather than a violation of it -- is the thing this PR's review needs to
# confirm, not something already decided by landing it.
#
# ALSO CARRIES: the rung-2 web-stack plan render for pull requests (round 3,
# after adversarial review PR #127 comment 5377613179). `.github/workflows/
# web-plan.yml` is push-to-main/workflow_dispatch-only (PR #110's "keep
# public PRs off private runners" invariant, restored there after round 2
# briefly and wrongly removed it for this one workflow). Something still has
# to report a real, always-executing conclusion on every PR so a future
# required `web-plan`-equivalent check can never freeze on an unrelated PR --
# this job is that something: it already runs on every `pull_request`
# unfiltered, is already this repository's declared PR validation authority
# (PR #110's own commit message), is already secret-free for this purpose,
# and, as of THIS PR, runs on the GF cache-fronted runner class directly
# (DRAFT PR #120, "ci: migrate off GitHub-hosted runners"/TIN-3914 Phase B,
# proposed the same move separately; per operator ruling L77 Q2 it is
# superseded by this PR and is being stripped/closed, not landed alongside
# it -- see #116's PR thread). `kubectl`/`yq`/`jq` are already available in
# this job's `nix develop .` devshell -- `just check-hosted` below already
# exercises `web-stack-validate` (and therefore the same tools) today, so
# the new step adds no new dependency.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # The ARC runner image's Node runtime serves JavaScript actions under this
  # shim, matching the other Great-Falls-Tool-Bus tinyland-nix workflows.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    runs-on: tinyland-nix
    timeout-minutes: 45
    steps:
      - name: Checkout overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: overlay
          persist-credentials: false
          fetch-depth: 0
      # No installer step: the tinyland-nix image ships the Nix daemon and the
      # GloriousFlywheel cache configuration. The guards below now assert that
      # the runner image is sane rather than that an installer succeeded.
      - name: Validate overlay contract
        env:
          GH_ACTION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for nixbin in /nix/var/nix/profiles/default/bin "${HOME}/.nix-profile/bin"; do
            if [ -d "${nixbin}" ]; then
              export PATH="${nixbin}:${PATH}"
            fi
          done

          if ! command -v nix >/dev/null 2>&1; then
            echo "::error::nix is required on the validation runner."
            exit 1
          fi

          if ! nix store ping >/dev/null 2>&1; then
            echo "::error::Nix daemon is unavailable on the tinyland-nix runner."
            exit 1
          fi

          append_nix_config_line() {
            local key="$1"
            local value="$2"
            if printf '%s\n' "${NIX_CONFIG:-}" | grep -Eq "^[[:space:]]*${key}[[:space:]]*="; then
              return 0
            fi
            if [ -n "${NIX_CONFIG:-}" ]; then
              export NIX_CONFIG="$(printf '%s\n%s = %s' "${NIX_CONFIG}" "${key}" "${value}")"
            else
              export NIX_CONFIG="${key} = ${value}"
            fi
          }

          append_nix_config_line "experimental-features" "nix-command flakes"
          append_nix_config_line "accept-flake-config" "true"
          append_nix_config_line "access-tokens" "github.com=${GH_ACTION_TOKEN}"
          cd overlay
          nix develop . -c just check-hosted

      # Cosmetic only: never gates whether the render step below executes --
      # it always executes and always reports. This just varies the summary
      # wording between "this change touches the web stack" and "informational
      # only, unrelated to this change" so a reviewer isn't told a render is
      # about their diff when it isn't.
      - name: Detect web-stack path relevance (wording only, never skips the render)
        id: web_stack_touch
        working-directory: overlay
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          touched="unknown"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            base="${PUSH_BEFORE_SHA}"
            head="${PUSH_AFTER_SHA}"
          else
            base=""
            head=""
          fi
          zero="0000000000000000000000000000000000000000"
          if [ -n "${base}" ] && [ "${base}" != "${zero}" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "${base}" "${head}" --)"
            touched="false"
            while IFS= read -r path; do
              [ -n "${path}" ] || continue
              case "${path}" in
                .github/workflows/web-plan.yml|.github/workflows/validate.yml|Justfile|k8s/web/*|scripts/validate-web-stack.sh|scripts/guard-no-remote-kustomize-resources.sh|tofu/intent/great-falls-tool-bus/*)
                  touched="true"
                  ;;
              esac
            done <<< "${changed}"
          fi
          echo "touched=${touched}" >> "$GITHUB_OUTPUT"

      # Always executes, always reports a real conclusion -- never a `skipped`
      # step. Offline, no cluster, no registry, no credential: the same
      # web-stack-render recipe web-plan.yml uses, behind the same
      # remote-resource guard.
      - name: Render web stack plan (rung 2, PR-side; offline, no cluster, no credential)
        env:
          TOUCHED: ${{ steps.web_stack_touch.outputs.touched }}
        run: |
          set -euo pipefail
          for nixbin in /nix/var/nix/profiles/default/bin "${HOME}/.nix-profile/bin"; do
            if [ -d "${nixbin}" ]; then
              export PATH="${nixbin}:${PATH}"
            fi
          done
          cd overlay
          nix develop . -c just web-stack-render > web-plan-rendered.yaml
          image="$(nix develop . -c yq -r 'select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "greatfallstoolbus-org") | .image' web-plan-rendered.yaml)"
          {
            echo "## GFTB web stack plan (rung 2, PR-side render -- no cluster, no credential)"
            echo ""
            if [ "${TOUCHED}" = "true" ]; then
              echo "This PR touches a web-stack path -- the render below reflects the tree at this PR's head."
            elif [ "${TOUCHED}" = "false" ]; then
              echo "This PR does not touch a web-stack path -- the render below is informational only, unrelated to this change."
            else
              echo "Could not determine whether this change touches a web-stack path -- rendering unconditionally (fail open to render, never to silently skip)."
            fi
            echo ""
            echo "This is the COMMITTED declare-only tree, not the reviewed"
            echo "candidate-promotion ceremony's output. The ceremony still"
            echo "supplies three things this render cannot, in order of"
            echo "consequence:"
            echo ""
            echo "1. **The per-release container image digest** -- the field"
            echo "   that decides what code production actually runs. This"
            echo "   render shows the digest currently committed to main"
            echo "   (below); it is NOT necessarily what the next release"
            echo "   ceremony will pin."
            echo "2. The per-release \`app.tinyland.dev/source-sha\` annotation."
            echo "3. The synthesized \`default-deny-egress\` NetworkPolicy."
            echo ""
            echo "**Committed image digest:** \`${image}\`"
            echo ""
            echo "See \`.github/workflows/web-plan.yml\`'s header for the full explanation."
            echo ""
            echo '```yaml'
            cat web-plan-rendered.yaml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # TRANSIENT TIN-4227 proof: PR-only, offline, secret-free. Removed after
      # the exact forward/reverse render bytes are captured and pinned.
      - name: Derive exact generation-40 forward and reverse render receipts
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/tin-4227-generation-40-parity'\n        working-directory: overlay\n        run: |\n          set -euo pipefail\n          for nixbin in /nix/var/nix/profiles/default/bin "${HOME}/.nix-profile/bin"; do\n            if [ -d "${nixbin}" ]; then export PATH="${nixbin}:${PATH}"; fi\n          done\n          export WEB_APPLY_REPLICAS=2\n          export WEB_APPLY_IMAGE=ghcr.io/great-falls-tool-bus/gftb-site@sha256:0295c226bd0bc78c0fe392b8955971ffbbd4fb9a0684939558d4c3d170a35dee\n          export WEB_APPLY_SHA=06e8b2c390b9c057fd084540e1e5710411a76a93\n          nix develop . -c just web-release-plan\n          mkdir -m 700 generation-40-render-proof\n          cp .k8s-plans/web-release.rendered.yaml generation-40-render-proof/forward.yaml\n          cp .k8s-plans/web-release.render-sha256 generation-40-render-proof/forward.sha256\n          export WEB_APPLY_IMAGE=ghcr.io/great-falls-tool-bus/gftb-site@sha256:e95c9588a320a92986ccbeff630c2837b0f3be08a9100ef505225f55194746d3\n          export WEB_APPLY_SHA=d22c0ca8f4683e5d93a554872b78d0a4a81e0028\n          nix develop . -c just web-release-plan\n          cp .k8s-plans/web-release.rendered.yaml generation-40-render-proof/reverse.yaml\n          cp .k8s-plans/web-release.render-sha256 generation-40-render-proof/reverse.sha256\n          chmod 600 generation-40-render-proof/*\n\n      - name: Upload exact generation-40 render receipts\n        if: github.event_name == 'pull_request' && github.head_ref == 'codex/tin-4227-generation-40-parity'\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2\n        with:\n          name: generation-40-render-proof-${{ github.event.pull_request.head.sha }}\n          path: overlay/generation-40-render-proof\n          if-no-files-found: error\n          retention-days: 1\n