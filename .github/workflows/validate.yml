name: Validate Overlay

# This public repository's validation is deliberately secret-free and runs on
# a GitHub-hosted runner. The selected `tinyland-nix` group remains restricted
# to admitted private repositories; validation must not weaken that boundary.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GF_CORE_REF: 2281b576bce0e8dd776a047b84e7464f5b508a62

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: overlay
          persist-credentials: false
      - name: Checkout public GloriousFlywheel core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: ${{ env.GF_CORE_REF }}
          path: GloriousFlywheel
          persist-credentials: false
      - name: Verify GloriousFlywheel core checkout
        run: |
          set -euo pipefail
          actual="$(git -C GloriousFlywheel rev-parse --verify HEAD)"
          if [ "${actual}" != "${GF_CORE_REF}" ]; then
            echo "::error::GloriousFlywheel checkout mismatch: expected ${GF_CORE_REF}, got ${actual}"
            exit 1
          fi
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Validate overlay contract
        env:
          GH_ACTION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for nixbin in /nix/var/nix/profiles/default/bin "${HOME}/.nix-profile/bin"; do
            if [ -d "${nixbin}" ]; then
              export PATH="${nixbin}:${PATH}"
            fi
          done

          if ! command -v nix >/dev/null 2>&1; then
            echo "::error::nix is required on the validation runner."
            exit 1
          fi

          if ! nix store ping >/dev/null 2>&1; then
            echo "::error::Nix daemon is unavailable after the pinned installer."
            exit 1
          fi

          append_nix_config_line() {
            local key="$1"
            local value="$2"
            if printf '%s\n' "${NIX_CONFIG:-}" | grep -Eq "^[[:space:]]*${key}[[:space:]]*="; then
              return 0
            fi
            if [ -n "${NIX_CONFIG:-}" ]; then
              export NIX_CONFIG="$(printf '%s\n%s = %s' "${NIX_CONFIG}" "${key}" "${value}")"
            else
              export NIX_CONFIG="${key} = ${value}"
            fi
          }

          append_nix_config_line "experimental-features" "nix-command flakes"
          append_nix_config_line "accept-flake-config" "true"
          append_nix_config_line "access-tokens" "github.com=${GH_ACTION_TOKEN}"
          cd overlay
          export GF_CORE_PATH=../GloriousFlywheel
          export GF_CORE_CI_PATH="github:tinyland-inc/GloriousFlywheel/${GF_CORE_REF}#ci"
          nix develop . -c just check
