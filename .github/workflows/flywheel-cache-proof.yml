name: Flywheel org-tenancy cache proof

# Enforcing shared-cache-backed proof for GFTB dogfood. It uses
# the fleet-projected front door; this workflow never downloads private GF
# source or invents an endpoint. Attachment, exchange, or cache failure is red.
#
# Endpoint authority is fleet-runtime env, never in this YAML: nix-setup exports
# BAZEL_REMOTE_CACHE from cluster DNS, and GF_REAPI_TOKEN_EXCHANGE_ENDPOINT comes
# from the fleet profile.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: flywheel-cache-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-proof:
    name: flywheel-cache-proof (org-great-falls-tool-bus)
    runs-on:
      group: great-falls-tool-bus-infra
      labels: tinyland-nix
    timeout-minutes: 15
    env:
      GFW_EXPECTED_INSTANCE_NAME: org-great-falls-tool-bus
      GFW_PROOF_REQUEST_MODE: auto
    steps:
      - name: Checkout overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # Endpoint-free cache attach. nix-setup derives BAZEL_REMOTE_CACHE from
      # fleet runtime and adds Nix to PATH.
      - name: Attach shared Bazel cache (fleet runtime env)
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@e07ac8b2b316eedeb3bbffea47af1acf05624545 # v2.12.1

      - name: Verify fleet OIDC front door (pinned)
        shell: bash
        env:
          GF_OIDC_PROFILE_SHA256: 0aa1bb2b1814c28d6162fc91d5cb3201ecaa13775e94ab3571db776d5dcc3ba8
        run: |
          set -euo pipefail
          helper="$(command -v flywheel-github-oidc-profile || true)"
          if [ -z "${helper}" ] || [[ "${helper}" != /* ]]; then
            echo "::error::fleet-projected flywheel-github-oidc-profile is unavailable."
            exit 1
          fi
          actual="$(sha256sum "${helper}" | awk '{ print $1 }')"
          if [ "${actual}" != "${GF_OIDC_PROFILE_SHA256}" ]; then
            echo "::error::flywheel-github-oidc-profile sha256 mismatch: expected ${GF_OIDC_PROFILE_SHA256}, got ${actual}"
            exit 1
          fi
          echo "verified fleet-projected flywheel-github-oidc-profile (sha256 ${actual})"

      - name: Install released GF credential helper
        uses: tinyland-inc/ci-templates/.github/actions/gf-credhelper-install@a76a637c8d1b2abe5fade554185892cb37a09c66 # v2.11.0
        with:
          version: v0.2.0
          sha256: 178fbf71b4892505e28ef5a05611485701fed8ba7ba1ada91d4d737b994f0cd2

      - name: Cache-backed org-tenancy Bazel proof
        shell: bash
        run: |
          set -euo pipefail
          command -v nix >/dev/null 2>&1 || {
            echo "::error::nix is unavailable; refusing to claim a Flywheel cache proof."
            exit 1
          }
          nix develop . --command just flywheel-cache-proof
