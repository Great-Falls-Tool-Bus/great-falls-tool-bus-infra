name: Flywheel org-tenancy cache proof

# Declare-only pre-soak lane for the GloriousFlywheel L5 org-mint activation
# (TIN-2364). It exchanges this repo's GitHub Actions OIDC identity for a
# gf-reapi-cell profile and runs a cache-backed, READ-ONLY Bazel round-trip
# routed to remote_instance_name=org-great-falls-tool-bus, giving the operator a
# real lane to observe during the cache-read pilot soak.
#
# INERT until activation + cell rollout: while runtime_grants_enabled is off for
# this repo the exchange mints the prior read-only default, and the shared cache
# / exchange front door are not yet on the runner, so the driver logs a loud
# notice and exits 0. The org tenant is activated and the round-trip proven
# (TIN-2364 soak, 2026-07-09), so this lane is now ENFORCING: a failed exchange
# or cache round-trip fails CI.
#
# Endpoint authority is fleet-runtime env, never in this YAML: nix-setup exports
# BAZEL_REMOTE_CACHE from cluster DNS, and GF_REAPI_TOKEN_EXCHANGE_ENDPOINT comes
# from the fleet profile.
# The Validate Overlay covers pull requests; this private-runner proof runs
# only on trusted pushes or manual dispatches.
#
# TIN-4015 (2026-08-22): GloriousFlywheel core went private. The unauthenticated
# raw.githubusercontent.com fetch of flywheel-github-oidc-profile.sh 404s the
# moment it actually gets a runner (run 32586919278). This job's own `if:` gate
# already restricts it to push/workflow_dispatch -- pull_request never reaches
# this job, on a fork or otherwise -- so a credentialed checkout here never
# exposes GF_CORE_DEPLOY_KEY to PR-authored content. The pinned OIDC helper is
# now read from a credentialed checkout at its own ARC/OIDC role pin
# (GF_OIDC_PROFILE_REF, deliberately independent of the implementation
# GF_CORE_REF pin other workflows use -- see config/organization.yaml's `core:`
# block) instead of curled unauthenticated; the sha256 content check is kept as
# defense-in-depth on top of the checkout's own HEAD assertion.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      request_mode:
        description: "Proof request mode. auto keeps PRs/read-only safe and uses cache-write only when the enforce-cell endpoint is present."
        type: choice
        default: auto
        options:
          - auto
          - cache-read
          - cache-write

permissions:
  contents: read
  id-token: write

concurrency:
  group: flywheel-cache-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  GF_OIDC_PROFILE_REF: 11ace397282ff89aeb1dfeb4a32fcbed3200c2ff

jobs:
  cache-proof:
    name: flywheel-cache-proof (org-great-falls-tool-bus)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: tinyland-nix
    timeout-minutes: 15
    env:
      GFW_EXPECTED_INSTANCE_NAME: org-great-falls-tool-bus
      GFW_PROOF_REQUEST_MODE: ${{ inputs.request_mode || 'auto' }}
    steps:
      - name: Checkout overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Checkout pinned GloriousFlywheel OIDC profile source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: ${{ env.GF_OIDC_PROFILE_REF }}
          path: GloriousFlywheel-oidc-profile
          ssh-key: ${{ secrets.GF_CORE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify GloriousFlywheel OIDC profile checkout
        run: |
          set -euo pipefail
          actual="$(git -C GloriousFlywheel-oidc-profile rev-parse --verify HEAD)"
          if [ "${actual}" != "${GF_OIDC_PROFILE_REF}" ]; then
            echo "::error::GloriousFlywheel OIDC profile checkout mismatch: expected ${GF_OIDC_PROFILE_REF}, got ${actual}"
            exit 1
          fi

      # Endpoint-free cache attach. nix-setup derives BAZEL_REMOTE_CACHE from
      # cluster DNS reachability (it invents no endpoint) and adds Nix to PATH.
      # Non-fatal: off-cluster / pre-rollout it warns and the driver stays inert.
      - name: Attach shared Bazel cache (fleet runtime env)
        id: cache-setup
        continue-on-error: true
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@v2

      - name: Fallback Nix on PATH
        if: steps.cache-setup.outcome != 'success'
        shell: bash
        run: |
          for nixbin in /nix/var/nix/profiles/default/bin "${HOME}/.nix-profile/bin"; do
            [ -d "${nixbin}" ] && echo "${nixbin}" >> "${GITHUB_PATH}"
          done

      # Install the fleet token-exchange front door, pinned to the L5
      # activation keystone commit and content-verified before it is trusted on
      # PATH. The cache-proof driver locates flywheel-github-oidc-profile via
      # command -v, so this step is what enables the OIDC exchange on the
      # runner. A hash mismatch fails this step and, now that the lane is
      # enforcing, fails CI. The file is copied from the credentialed checkout
      # above (TIN-4015) rather than curled unauthenticated from
      # raw.githubusercontent.com -- GloriousFlywheel is private now, so an
      # unauthenticated fetch 404s.
      - name: Install fleet OIDC front door (pinned)
        shell: bash
        env:
          GF_OIDC_PROFILE_SHA256: 0aa1bb2b1814c28d6162fc91d5cb3201ecaa13775e94ab3571db776d5dcc3ba8
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/gf-tools"
          dest="${tools_dir}/flywheel-github-oidc-profile"
          src="GloriousFlywheel-oidc-profile/scripts/flywheel-github-oidc-profile.sh"
          mkdir -p "${tools_dir}"
          cp "${src}" "${dest}"
          actual="$(sha256sum "${dest}" | awk '{ print $1 }')"
          if [ "${actual}" != "${GF_OIDC_PROFILE_SHA256}" ]; then
            echo "::error::flywheel-github-oidc-profile sha256 mismatch: expected ${GF_OIDC_PROFILE_SHA256}, got ${actual}"
            exit 1
          fi
          chmod +x "${dest}"
          echo "${tools_dir}" >> "${GITHUB_PATH}"
          echo "installed pinned flywheel-github-oidc-profile (sha256 ${actual})"

      - name: Install released GF credential helper
        uses: tinyland-inc/ci-templates/.github/actions/gf-credhelper-install@v2.11.0
        with:
          version: v0.2.0
          sha256: 178fbf71b4892505e28ef5a05611485701fed8ba7ba1ada91d4d737b994f0cd2

      - name: Cache-backed org-tenancy Bazel proof
        shell: bash
        run: |
          set -uo pipefail
          if command -v nix >/dev/null 2>&1; then
            nix develop . --command just flywheel-cache-proof
          else
            echo "::warning::nix unavailable on runner; org-tenancy cache proof skipped (inert pre-activation)."
          fi
