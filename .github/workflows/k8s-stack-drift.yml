name: K8s Stack Drift (zero-diff where applicable)

# Scheduled, read-only drift-check lane for the namespace-scoped k8s workload
# stacks (k8s/{mail,list,form,archive,list-sync,web}): every 12h it diffs LIVE
# cluster state against the committed manifests via `kubectl diff -k`
# (server-side, NO apply) -- mirroring edge-drift.yml's zero-diff philosophy
# for tofu/stacks/edge, applied here to the Kubernetes CR/workload stacks
# instead of Tofu state.
#
# mail/list/form/archive/list-sync are TRUE zero-diff stacks: nothing patches
# them imperatively after `just <stack>-apply` runs, so any diff IS real
# drift and FAILS the gate (hard error), same as edge-drift.yml's "assert
# zero-diff". list-sync (TIN-3813) is the add-only keyholders->discuss
# reconciler: it ships suspend:true + LISTSYNC_DRY_RUN:"true" and its whole
# activation story is "an operator decision in git" (infra PR #122's review,
# EDIT-2) -- that claim is only true if an out-of-band `kubectl patch cronjob
# mailman-listsync -p '{"spec":{"suspend":false}}'` (or any other imperative
# relaxation) is visible somewhere. This job is that somewhere.
#
# web is now HELD TO THE SAME BAR (rung 1 tree honesty, 2026-08-21; session
# register L71 Q2 rungs 1+2): k8s/web/greatfallstoolbus-org-production is
# ATTENDED-ONLY declare-only, not parked (replicas 2 + a digest-pinned image of
# the promoted gftb-site static origin + no Namespace object --
# scripts/validate-web-stack.sh guards exactly that), and the committed
# manifests now name the SAME repository the live on-cluster state actually
# runs. Until this fix, this header declared the divergence PERMANENT and
# by-design; it wasn't -- the committed manifests simply named the retired
# legacy adapter-node image after the gftb-site promotion, and nothing ever
# corrected the declarative record. The honest invariant is: the tree pins
# what is served, an operator updates it at each web-release-* ceremony's pin
# step, and a real diff here now means the tree and the cluster disagree and
# one of them needs fixing. The web job therefore FAILS the workflow on a
# diff, same as the true-zero-diff stacks above -- with one known, bounded
# residual: the web-release-* render step (Justfile `web-release-render`)
# always synthesizes a default-deny-egress NetworkPolicy and an
# `app.tinyland.dev/source-sha` annotation that the checked-in base does not
# declare (the annotation's value changes every release; the NetworkPolicy
# can't be declared in git without the render step double-adding it -- see the
# deployment.yaml/networkpolicy.yaml headers). Expect exactly those two
# objects/fields to show up on every run until a follow-up teaches the
# ceremony to commit its own rendered output back to git. See Justfile
# `_k8s-drift-check` for the full rationale.
#
# CREDENTIALS: reuses the SAME namespace-scoped kubeconfig secrets the
# existing apply lanes already use -- no new secret is introduced here.
#   * WEB_APPLY_KUBECONFIG_B64, protected `web-apply` environment (this workflow
#     is its only remaining consumer since TIN-3899 retired web-stack.yml)
#   * MAIL_APPLY_KUBECONFIG_B64 / GFTB_MAIL_KUBECONFIG_B64, protected `mail`
#     environment (mail-crs.yml / list-crs.yml / form-crs.yml / archive-stack.yml)
# `kubectl diff` needs only read (get/list) RBAC on the stack's own resources --
# a strict subset of what the apply-scoped kubeconfig already grants, so no new
# permission is requested either. Runs on the same self-hosted `tinyland-nix`
# runner (on-cluster/tailnet reachable) every other apply/validate workflow in
# this repo uses. Like edge-drift.yml, this fails SOFT (skip, not red) when an
# environment secret is absent -- the runbook mints these late.

on:
  schedule:
    # Every 12 hours, offset from edge-drift.yml's 00:00/12:00 so the two
    # scheduled drift lanes don't contend for the same tinyland-nix runners.
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# D6 (2026-08-21 truthing; rung 1 fix): cancel-in-progress was true, keyed only
# on github.ref (constant across every scheduled run). `gh run list` showed
# this lane's scheduled runs sitting `queued` for ~11h45m-12h20m and then
# turning `cancelled` -- almost exactly one 12h cron interval -- because the
# NEXT scheduled run's concurrency group cancelled the STILL-QUEUED previous
# one before a runner was ever offered to it. Once a run is starved past the
# next schedule boundary, cancel-in-progress:true guarantees it can never
# complete, which is exactly how a non-completing gate reads as green (nothing
# ever fails; it just silently never finishes). This job is read-only
# (`kubectl diff`, never applies), so there is no correctness reason to
# preempt a queued or running instance -- cancel-in-progress:false lets a
# delayed run actually finish once a runner is available, up to GitHub's own
# platform-level queued-job expiry. This does NOT fix runner-pool starvation
# itself if the pool is currently unavailable/wedged (see the PR body's D6
# diagnosis -- TIN-3902 already re-rostered this repo's own runner group
# 2026-08-19, but jobs of every trigger type, not just scheduled ones, were
# still observed stuck `queued` in this repo as of this fix, which is neither
# explained nor covered by TIN-3971 -- that ticket's runner-group admission
# gap is scoped to tinyland-infra's ~60 OTHER spoke/package repos, not this
# repo's already-dedicated great-falls-tool-bus-infra group).
concurrency:
  group: k8s-stack-drift-${{ github.ref }}
  cancel-in-progress: false

env:
  GF_CORE_REF: 2281b576bce0e8dd776a047b84e7464f5b508a62

jobs:
  mail-stacks-drift:
    name: Assert zero-diff (mail, list, form, archive)
    runs-on: tinyland-nix
    timeout-minutes: 20
    # Same protected `mail` environment mail-crs.yml / list-crs.yml /
    # form-crs.yml / archive-stack.yml already bind for their server/apply jobs.
    environment: mail
    env:
      HAS_MAIL_KUBECONFIG: ${{ secrets.MAIL_APPLY_KUBECONFIG_B64 != '' || secrets.GFTB_MAIL_KUBECONFIG_B64 != '' }}
    steps:
      - name: Check mail-environment kubeconfig secret
        id: secrets
        run: |
          if [ "${HAS_MAIL_KUBECONFIG}" != "true" ]; then
            echo "::notice::MAIL_APPLY_KUBECONFIG_B64 (or GFTB_MAIL_KUBECONFIG_B64) is not configured in the protected mail environment; skipping the mail/list/form/archive drift check (fail-soft -- the runbook mints this secret late, same idiom as mail-crs.yml)."
            echo "kubeconfig-present=false" >> "$GITHUB_OUTPUT"
          else
            echo "kubeconfig-present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout overlay
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: overlay
          persist-credentials: false

      - name: Checkout pinned GloriousFlywheel core
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: ${{ env.GF_CORE_REF }}
          path: GloriousFlywheel
          persist-credentials: false

      - name: Verify GloriousFlywheel core checkout
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        run: |
          set -euo pipefail
          actual="$(git -C GloriousFlywheel rev-parse --verify HEAD)"
          if [ "${actual}" != "${GF_CORE_REF}" ]; then
            echo "::error::GloriousFlywheel checkout mismatch: expected ${GF_CORE_REF}, got ${actual}"
            exit 1
          fi

      - name: Materialize namespace kubeconfig
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        env:
          MAIL_APPLY_KUBECONFIG_B64: ${{ secrets.MAIL_APPLY_KUBECONFIG_B64 }}
          GFTB_MAIL_KUBECONFIG_B64: ${{ secrets.GFTB_MAIL_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          kubeconfig="${RUNNER_TEMP}/gftb-mail.kubeconfig"
          if [[ -n "${MAIL_APPLY_KUBECONFIG_B64:-}" ]]; then
            kubeconfig_b64="${MAIL_APPLY_KUBECONFIG_B64}"
          else
            kubeconfig_b64="${GFTB_MAIL_KUBECONFIG_B64}"
          fi
          printf '%s' "${kubeconfig_b64}" | base64 -d > "${kubeconfig}"
          chmod 600 "${kubeconfig}"
          echo "GFTB_MAIL_KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"

      - name: Drift check -- mail CRs
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        uses: ./GloriousFlywheel/.github/actions/nix-job
        with:
          push-cache: "false"
          command: |
            set -euo pipefail
            cd overlay
            export GF_CORE_PATH=../GloriousFlywheel
            export GF_CORE_CI_PATH="github:tinyland-inc/GloriousFlywheel/${GF_CORE_REF}#ci"
            nix develop "${GF_CORE_CI_PATH}" -c just mail-cr-drift-check

      - name: Drift check -- list stack
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        uses: ./GloriousFlywheel/.github/actions/nix-job
        with:
          push-cache: "false"
          command: |
            set -euo pipefail
            cd overlay
            export GF_CORE_PATH=../GloriousFlywheel
            export GF_CORE_CI_PATH="github:tinyland-inc/GloriousFlywheel/${GF_CORE_REF}#ci"
            nix develop "${GF_CORE_CI_PATH}" -c just list-stack-drift-check

      - name: Drift check -- form stack
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        uses: ./GloriousFlywheel/.github/actions/nix-job
        with:
          push-cache: "false"
          command: |
            set -euo pipefail
            cd overlay
            export GF_CORE_PATH=../GloriousFlywheel
            export GF_CORE_CI_PATH="github:tinyland-inc/GloriousFlywheel/${GF_CORE_REF}#ci"
            nix develop "${GF_CORE_CI_PATH}" -c just form-stack-drift-check

      - name: Drift check -- archive stack
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        uses: ./GloriousFlywheel/.github/actions/nix-job
        with:
          push-cache: "false"
          command: |
            set -euo pipefail
            cd overlay
            export GF_CORE_PATH=../GloriousFlywheel
            export GF_CORE_CI_PATH="github:tinyland-inc/GloriousFlywheel/${GF_CORE_REF}#ci"
            nix develop "${GF_CORE_CI_PATH}" -c just archive-stack-drift-check

      - name: Drift check -- list-sync stack (TIN-3813)
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        uses: ./GloriousFlywheel/.github/actions/nix-job
        with:
          push-cache: "false"
          command: |
            set -euo pipefail
            cd overlay
            export GF_CORE_PATH=../GloriousFlywheel
            export GF_CORE_CI_PATH="github:tinyland-inc/GloriousFlywheel/${GF_CORE_REF}#ci"
            nix develop "${GF_CORE_CI_PATH}" -c just listsync-stack-drift-check

      - name: Upload drift artifacts
        if: always() && steps.secrets.outputs.kubeconfig-present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gftb-mail-stacks-drift
          path: |
            overlay/mail-cr-drift.txt
            overlay/list-stack-drift.txt
            overlay/form-stack-drift.txt
            overlay/archive-stack-drift.txt
            overlay/listsync-stack-drift.txt
          if-no-files-found: ignore
          retention-days: 7

  web-stack-drift:
    name: Assert web-stack diff (fails on diff; see header for the known residual)
    runs-on: tinyland-nix
    timeout-minutes: 20
    # The protected `web-apply` environment. This read-only diff job is now its
    # only consumer: TIN-3899 deleted web-stack.yml, the environment's former
    # apply lane. The secret still grants only namespace-scoped access, and
    # `kubectl diff` needs a strict read-only subset of it.
    environment: web-apply
    env:
      HAS_WEB_APPLY_KUBECONFIG: ${{ secrets.WEB_APPLY_KUBECONFIG_B64 != '' }}
    steps:
      - name: Check web-apply kubeconfig secret
        id: secrets
        run: |
          if [ "${HAS_WEB_APPLY_KUBECONFIG}" != "true" ]; then
            echo "::notice::WEB_APPLY_KUBECONFIG_B64 is not configured in the protected web-apply environment; skipping the web-stack diff report (fail-soft)."
            echo "kubeconfig-present=false" >> "$GITHUB_OUTPUT"
          else
            echo "kubeconfig-present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout overlay
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: overlay
          persist-credentials: false

      - name: Checkout pinned GloriousFlywheel core
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: ${{ env.GF_CORE_REF }}
          path: GloriousFlywheel
          persist-credentials: false

      - name: Verify GloriousFlywheel core checkout
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        run: |
          set -euo pipefail
          actual="$(git -C GloriousFlywheel rev-parse --verify HEAD)"
          if [ "${actual}" != "${GF_CORE_REF}" ]; then
            echo "::error::GloriousFlywheel checkout mismatch: expected ${GF_CORE_REF}, got ${actual}"
            exit 1
          fi

      - name: Materialize web-apply kubeconfig
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        env:
          WEB_APPLY_KUBECONFIG_B64: ${{ secrets.WEB_APPLY_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          kubeconfig="${RUNNER_TEMP}/web-apply.kubeconfig"
          printf '%s' "${WEB_APPLY_KUBECONFIG_B64}" | base64 -d > "${kubeconfig}"
          chmod 600 "${kubeconfig}"
          echo "WEB_APPLY_KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"

      - name: Diff check -- web stack (fails on diff; see header)
        if: steps.secrets.outputs.kubeconfig-present == 'true'
        uses: ./GloriousFlywheel/.github/actions/nix-job
        with:
          push-cache: "false"
          command: |
            set -euo pipefail
            cd overlay
            export GF_CORE_PATH=../GloriousFlywheel
            export GF_CORE_CI_PATH="github:tinyland-inc/GloriousFlywheel/${GF_CORE_REF}#ci"
            nix develop "${GF_CORE_CI_PATH}" -c just web-stack-drift-check

      - name: Upload drift artifact
        if: always() && steps.secrets.outputs.kubeconfig-present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gftb-web-stack-drift
          path: overlay/web-stack-drift.txt
          if-no-files-found: ignore
          retention-days: 7
